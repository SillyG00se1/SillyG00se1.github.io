let W=0,H=0,mode=null,pressed=false,last=performance.now(),full=false;
let lava=0,lavaPhase=0,lavaBubbles=[],bubbles=[],fireworks=[],glitter=[],bursts=[],ripples=[],paintSplatters=[],balls=[];
let dogY=0,dogState="inside",dogTimer=0;

function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}
addEventListener("resize",resize);resize();

const modes=[
 ["LAVA","🌋","lava"],["BUBBLES","●","bubbles"],["FIREWORKS","✦","fireworks"],
 ["GLITTER","✧","glitter"],["PAINT SPLOTCHES","🎨","paint"],["GIANT BALL DROP","●","ball"],
 ["COLOR BURSTS","✦","bursts"],["RAINBOW RIPPLES","◉","ripples"],["DOGHOUSE","🐶","dog"]
];

function home(){mode=null;pressed=false;document.getElementById("status").textContent="";draw()}
function choose(m){mode=m;pressed=false;document.getElementById("homeHint").textContent="";clearMode()}
function clearMode(){lavaBubbles=[];bubbles=[];fireworks=[];glitter=[];bursts=[];ripples=[];paintSplatters=[];balls=[];lava=0;dogState="inside";dogTimer=0}

function drawButton(x,y,w,h,title,symbol,m){
 ctx.fillStyle="#171722";ctx.strokeStyle="#55556d";ctx.lineWidth=3;ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);
 ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="bold "+Math.max(38,h*.28)+"px Arial";ctx.fillText(symbol,x+w/2,y+h*.39);
 ctx.font="bold "+Math.max(18,h*.12)+"px Arial";ctx.fillText(title,x+w/2,y+h*.78);
}
function drawHome(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff";ctx.textAlign="center";
 ctx.font="bold "+Math.max(30,W*.035)+"px Arial";ctx.fillText("CVI Switch Activated Suite",W/2,H*.10);
 ctx.fillStyle="#00ffff";ctx.font="bold "+Math.max(18,W*.018)+"px Arial";ctx.fillText("Cause & Effect",W/2,H*.17);
 const cols=3,bw=Math.min(300,W*.27),bh=Math.min(135,H*.15),gx=Math.min(28,W*.018),gy=Math.min(20,H*.018);
 const total=bw*cols+gx*2,x0=W/2-total/2,y0=H*.20;
 modes.forEach((a,i)=>{const r=Math.floor(i/cols),col=i%cols;drawButton(x0+col*(bw+gx),y0+r*(bh+gy),bw,bh,a[0],a[1],a[2])});
 document.getElementById("homeHint").textContent="SPACE = activate   F = full screen   ESC = Home";
}
function label(t){ctx.textAlign="left";ctx.fillStyle="#fff";ctx.font="bold 22px Arial";ctx.fillText(t,18,30);ctx.textAlign="right";ctx.fillStyle="#9696a6";ctx.font="16px Arial";ctx.fillText("F = Full Screen   ESC = Home",W-18,30)}

function activate(){
 if(mode==="lava"){lava=1;for(let i=0;i<28;i++)lavaBubbles.push({x:Math.random()*W,y:H*(.52+Math.random()*.36),r:5+Math.random()*12,v:80+Math.random()*100,life:1+Math.random()*1.5})}
 if(mode==="bubbles"){for(let i=0;i<32;i++)bubbles.push({x:W*i/31+(Math.random()*40-20),y:H+30,r:14+Math.random()*20,v:170+Math.random()*110,p:Math.random()*6.28,life:3+Math.random()*2.5})}
 if(mode==="fireworks"){for(let i=0;i<5+Math.floor(Math.random()*3);i++)launch()}
 if(mode==="glitter"){for(let i=0;i<260;i++)glitter.push({x:Math.random()*W,y:Math.random()*H*.78,s:.8+Math.random()*4.8,l:1.8+Math.random()*2.8,p:Math.random()*6.28,d:(Math.random()*55-27),v:5+Math.random()*32,t:.8+Math.random()*2.4,c:["#ffffff","#fff7a8","#8be9ff","#ff9ee8","#d8b4ff","#b7ffcf"][Math.floor(Math.random()*6)],tw:Math.random()<.30,type:Math.random()<.35?1:0})}
 if(mode==="paint"){let colors=["#ff1744","#ffea00","#00e5ff","#39ff14","#d500f9","#ff6d00","#2979ff"];for(let i=0;i<5;i++){let p={x:W*(.15+.7*Math.random()),y:H*(.18+.62*Math.random()),r:5,max:70+Math.random()*110,l:1,c:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*6.28,drops:[]};for(let j=0;j<18;j++){let a=Math.random()*Math.PI*2;p.drops.push({x:p.x,y:p.y,vx:Math.cos(a)*(45+Math.random()*115),vy:Math.sin(a)*(45+Math.random()*115),r:2+Math.random()*7,life:1})}paintSplatters.push(p)}}
 if(mode==="ball"){balls.push({x:W*(.2+.6*Math.random()),y:-100,r:Math.min(100,W*.075),vy:80+Math.random()*40,bounce:0,c:["#ff1744","#2979ff","#ffea00","#39ff14","#d500f9","#ff6d00"][Math.floor(Math.random()*6)]});}
 if(mode==="bursts"){for(let i=0;i<5;i++)bursts.push({x:W*(.12+.76*Math.random()),y:H*(.18+.54*Math.random()),r:8,max:100+Math.random()*130,l:1,c:["#ff1744","#ffea00","#00e5ff","#39ff14","#ff00ff","#ff6d00","#2979ff"][Math.floor(Math.random()*7)],v:160+Math.random()*100})}
 if(mode==="ripples"){for(let i=0;i<6;i++)ripples.push({x:W*(.12+.76*Math.random()),y:H*(.22+.56*Math.random()),r:5+Math.random()*15,l:1,k:Math.floor(Math.random()*6)})}
 if(mode==="dog"){dogState="coming";dogY=H*.72;dogTimer=0;try{bark.currentTime=0;bark.play()}catch(e){}}
}

function launch(){fireworks.push({x:W*(.12+.76*Math.random()),y:H+20,target:H*(.18+.4*Math.random()),vy:-(420+Math.random()*150),parts:null,trail:[],color:["#ff1744","#ffd600","#00e5ff","#39ff14","#d500f9","#fff"][Math.floor(Math.random()*6)]})}
function explode(f){f.parts=[];f.flash=1;for(let i=0;i<90;i++){let a=Math.random()*Math.PI*2,s=110+Math.random()*220;f.parts.push({x:f.x,y:f.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.7+Math.random()*.8,c:f.color,r:1.5+Math.random()*2.5})}}

function update(dt){
 if(mode==="lava"){lava=Math.max(0,lava-dt*.08);lavaPhase+=dt*(1.2+lava*5);lavaBubbles.forEach(b=>{b.y-=b.v*dt;b.life-=dt});lavaBubbles=lavaBubbles.filter(b=>b.life>0&&b.y>H*.18)}
 if(mode==="bubbles"){bubbles.forEach(b=>{b.y-=b.v*dt;b.p+=dt*5;b.x+=Math.sin(b.p)*35*dt;b.life-=dt});bubbles=bubbles.filter(b=>b.life>0&&b.y>50)}
 if(mode==="fireworks")fireworks.forEach(f=>{if(!f.parts){f.y+=f.vy*dt;f.vy+=125*dt;f.trail.push({x:f.x,y:f.y,l:1});f.trail.forEach(t=>t.l-=dt*3);f.trail=f.trail.filter(t=>t.l>0);if(f.y<=f.target)explode(f)}else{f.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=72*dt;p.vx*=.982;p.vy*=.982;p.l-=dt});f.parts=f.parts.filter(p=>p.l>0)}});fireworks=fireworks.filter(f=>!f.parts||f.parts.length)
 if(mode==="glitter"){glitter.forEach(g=>{g.y+=g.v*dt;g.x+=Math.sin(g.p)*g.d*dt;g.p+=g.t*dt;g.l-=dt*.22});glitter=glitter.filter(g=>g.l>0&&g.y<H+20)}
 if(mode==="paint"){paintSplatters.forEach(p=>{p.r+=(p.max-p.r)*dt*7;p.l-=dt*.30;p.drops.forEach(d=>{d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx*=.975;d.vy*=.975;d.life-=dt*.45})});paintSplatters=paintSplatters.filter(p=>p.l>0)}
 if(mode==="ball"){balls.forEach(b=>{b.vy+=650*dt;b.y+=b.vy*dt;if(b.y+b.r>=H*.82){b.y=H*.82-b.r;b.vy=-b.vy*.72;b.bounce++;if(Math.abs(b.vy)<120)b.vy=0}});balls=balls.filter(b=>b.bounce<5||Math.abs(b.vy)>0)}
 if(mode==="bursts"){bursts.forEach(b=>{b.r+=b.v*dt;b.l-=dt*.7});bursts=bursts.filter(b=>b.l>0&&b.r<b.max)}
 if(mode==="ripples"){ripples.forEach(r=>{r.r+=(100+280)*dt;r.l-=dt*.38});ripples=ripples.filter(r=>r.l>0&&r.r<Math.max(W,H)*.9)}
 if(mode==="dog"){dogTimer+=dt;if(dogState==="coming"){dogY-=250*dt;if(dogY<=H*.25){dogY=H*.25;dogState="bouncing";dogTimer=0}}else if(dogState==="bouncing"&&dogTimer>1.8){dogState="going";dogTimer=0}else if(dogState==="going"){dogY+=170*dt;if(dogY>=H*.72){dogY=H*.72;dogState="inside"}}}
}

function draw(){
 ctx.clearRect(0,0,W,H);
 if(!mode){drawHome();return}
 if(mode==="lava")drawLava();else if(mode==="bubbles")drawBubbles();else if(mode==="fireworks")drawFireworks();else if(mode==="glitter")drawGlitter();else if(mode==="paint")drawPaint();else if(mode==="ball")drawBall();else if(mode==="paint")drawPaint();else if(mode==="ball")drawBall();else if(mode==="bursts")drawBursts();else if(mode==="ripples")drawRipples();else drawDog();
}
function drawLava(){let base=H*(1-(.25+.42*lava)),pts=[];for(let i=0;i<=120;i++){let x=i*W/120;let y=base+Math.sin(lavaPhase*.85+i*.105)*(12+28*lava)+Math.sin(lavaPhase*1.75-i*.19)*(6+17*lava)+Math.sin(lavaPhase*3+i*.41)*(3+9*lava);let sp=Math.sin(lavaPhase*.55+i*.34);y-=Math.max(0,sp)**4*(18+125*lava);pts.push([x,y])}ctx.beginPath();ctx.moveTo(0,H);pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle="#f21b0b";ctx.fill();ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]+22+Math.sin(lavaPhase*1.3+p[0]*.014)*10):ctx.moveTo(p[0],p[1]+22));ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle="#ff5a00";ctx.fill();ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle="#ffd21f";ctx.lineWidth=5+4*lava;ctx.stroke();lavaBubbles.forEach(b=>{ctx.fillStyle="#ff7a00";ctx.strokeStyle="#fff04a";ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.stroke()});label("LAVA")}
function drawBubbles(){bubbles.forEach(b=>{ctx.fillStyle="#0066ff";ctx.strokeStyle="#00e5ff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.stroke();ctx.fillStyle="#e8ffff";ctx.beginPath();ctx.arc(b.x-b.r*.35,b.y-b.r*.35,b.r*.18,0,7);ctx.fill()});label("BLUE BUBBLES")}
function drawFireworks(){fireworks.forEach(f=>{if(!f.parts){f.trail.forEach(t=>{ctx.fillStyle=f.color;ctx.globalAlpha=t.l;ctx.beginPath();ctx.arc(f.x,f.y+10,2+4*t.l,0,7);ctx.fill();ctx.globalAlpha=1})}else{f.parts.forEach(p=>{let a=Math.max(0,p.l);ctx.globalAlpha=a;ctx.strokeStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=10;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x-p.vx*.018,p.y-p.vy*.018);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*1.5,0,7);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1})}});label("FIREWORKS")}
function drawGlitter(){glitter.forEach(g=>{let pulse=(Math.sin(g.p*2.7)+1)/2,alpha=Math.min(1,g.l),size=g.s*(.55+.75*pulse);ctx.globalAlpha=alpha;ctx.fillStyle=g.c;ctx.shadowColor=g.c;ctx.shadowBlur=5+size*4;ctx.beginPath();ctx.arc(g.x,g.y,size,0,7);ctx.fill();ctx.shadowBlur=0;if(g.tw&&pulse>.48){let a=size*(2.8+3.5*pulse);ctx.strokeStyle="#fff";ctx.lineWidth=Math.max(1,size*.34);ctx.globalAlpha=alpha*.9;ctx.beginPath();ctx.moveTo(g.x-a,g.y);ctx.lineTo(g.x+a,g.y);ctx.moveTo(g.x,g.y-a);ctx.lineTo(g.x,g.y+a);ctx.stroke();ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(g.x-a*.48,g.y-a*.48);ctx.lineTo(g.x+a*.48,g.y+a*.48);ctx.moveTo(g.x+a*.48,g.y-a*.48);ctx.lineTo(g.x-a*.48,g.y+a*.48);ctx.stroke()}if(g.type===1&&pulse>.65){ctx.fillStyle="#fff";ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(g.x,g.y,Math.max(1,size*.42),0,7);ctx.fill()}});ctx.globalAlpha=1;label("SPARKLING GLITTER")}
function drawPaint(){paintSplatters.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,p.l*1.5);ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.restore();p.drops.forEach(d=>{if(d.life>0){ctx.globalAlpha=Math.min(1,d.life*p.l*1.4);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fill()}});ctx.globalAlpha=1});label("PAINT SPLOTCHES")}
function drawBall(){balls.forEach(b=>{ctx.save();let impact=Math.max(0,1-Math.abs(b.vy)/650);ctx.translate(b.x,b.y);ctx.scale(1+impact*.18,1-impact*.15);ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(0,0,b.r,0,7);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.stroke();ctx.fillStyle="rgba(255,255,255,.45)";ctx.beginPath();ctx.arc(-b.r*.32,-b.r*.35,b.r*.18,0,7);ctx.fill();ctx.restore()});label("GIANT BALL DROP")}
function drawBursts(){bursts.forEach(b=>{ctx.fillStyle=b.c;ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.stroke();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(b.x,b.y,b.r*.45,0,7);ctx.fill()});label("COLOR BURSTS")}
function drawRipples(){const cs=["#ff1744","#ffea00","#39ff14","#00e5ff","#2979ff","#d500f9"];ripples.forEach(r=>{for(let j=0;j<5;j++){let rr=r.r-j*10;if(rr>4){ctx.strokeStyle=cs[(r.k+j)%cs.length];ctx.lineWidth=Math.max(2,7-j);ctx.beginPath();ctx.arc(r.x,r.y,rr,0,7);ctx.stroke()}}});label("RAINBOW RIPPLES")}
function drawDog(){ctx.fillStyle="#18351f";ctx.fillRect(0,H*.78,W,H*.22);let hw=Math.min(360,W*.34),hh=Math.min(250,H*.32),x1=W/2-hw/2,x2=W/2+hw/2,y2=H*.80,y1=y2-hh;ctx.fillStyle="#d35400";ctx.strokeStyle="#ffd54f";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x1-25,y1+70);ctx.lineTo(W/2,y1-70);ctx.lineTo(x2+25,y1+70);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle="#a83b00";ctx.fillRect(x1,y1+65,hw,hh-65);ctx.strokeRect(x1,y1+65,hw,hh-65);ctx.fillStyle="#25130b";ctx.beginPath();ctx.arc(W/2,y2-hh*.42,hw*.21,Math.PI,0);ctx.lineTo(W/2+hw*.21,y2);ctx.lineTo(W/2-hw*.21,y2);ctx.closePath();ctx.fill();if(dogState!=="inside"){let s=Math.min(260,W*.22);ctx.drawImage(dog,dogY?W/2:W/2-dog.width/2,dogY-s*.35,s,s*.66)}ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 20px Arial";ctx.fillText("Pup Hut",W/2,y1+25);label("DOGHOUSE — PRESS SPACE FOR THE DOG!")}
function frame(t){let dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);

addEventListener("keydown",e=>{
 if(e.key==="f"||e.key==="F"){full=!full;(full?document.documentElement.requestFullscreen():document.exitFullscreen?.()).catch?.(()=>{});return}
 if(e.key==="Escape"){if(document.fullscreenElement){document.exitFullscreen?.();}else home();return}
 if(e.code==="Space"){e.preventDefault();if(!pressed){pressed=true;if(mode===null){/* home selection not keyboard-scanned; space activates current mode only when chosen by click */}else activate()}return}
});
addEventListener("keyup",e=>{if(e.code==="Space"){pressed=false;e.preventDefault()}});
canvas.addEventListener("click",e=>{
 if(mode===null){const cols=3,bw=Math.min(300,W*.27),bh=Math.min(135,H*.15),gx=Math.min(28,W*.018),gy=Math.min(20,H*.018),total=bw*cols+gx*2,x0=W/2-total/2,y0=H*.20;for(let i=0;i<modes.length;i++){let r=Math.floor(i/cols),col=i%cols,x=x0+col*(bw+gx),y=y0+r*(bh+gy);if(e.clientX>=x&&e.clientX<=x+bw&&e.clientY>=y&&e.clientY<=y+bh){choose(modes[i][2]);break}}}
});
</script>
