<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Balloon Pop Switch Game</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:#eef8ff;color:#111}
button{font:700 24px "Trebuchet MS",Arial,sans-serif;cursor:pointer}
.screen{width:100vw;height:100vh;padding:16px;display:flex;flex-direction:column}
.center{align-items:center;justify-content:center}
h1{font-size:clamp(34px,4vw,58px);margin:0 0 22px;text-align:center}
h2{font-size:clamp(28px,3vw,42px);margin:0 0 18px;text-align:center}
.instructions{font-size:clamp(20px,2vw,28px);font-weight:bold;text-align:center;margin:0 0 22px}
.panel{width:min(1050px,94vw);background:#fff;border:3px solid #777;border-radius:18px;padding:26px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.setup-options{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:22px 0}
.setup-btn{min-height:145px;border:5px solid #777;border-radius:18px;background:#ddd;padding:18px;font-size:30px}
.setup-btn:hover,.setup-btn:focus{outline:5px solid #111;background:#fff}
.setup-btn small{display:block;font-size:19px;margin-top:12px;font-weight:600}
.scan-header{flex:0 0 auto;text-align:center}
.scan-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:12px 18px;overflow:visible}
.scan-choice{position:relative;min-height:0;border:6px solid #aaa;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;transform:scale(.95);transition:box-shadow .08s,border-color .08s,transform .08s}
.scan-choice.scanning{border-color:#ffd400;box-shadow:0 0 0 8px #ffd400 inset,0 0 24px 9px #ffd400,0 0 48px 16px rgba(255,212,0,.75);transform:scale(.98);z-index:3}
.scan-choice .number{position:absolute;left:12px;top:10px;width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid #333;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:bold;z-index:4}
.color-balloon{width:min(38%,145px);aspect-ratio:.78;border-radius:50% 50% 48% 48%;position:relative;box-shadow:inset -18px -15px 25px rgba(0,0,0,.16),inset 15px 12px 20px rgba(255,255,255,.38),0 7px 12px rgba(0,0,0,.15)}
.color-balloon:after{content:"";position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:20px solid currentColor}
.choice-label{position:absolute;bottom:12px;left:10px;right:10px;text-align:center;font-size:clamp(22px,2.3vw,34px);font-weight:bold;background:rgba(255,255,255,.9);border-radius:10px;padding:6px}
.face{width:210px;height:150px;position:relative}
.face:before,.face:after{content:"";position:absolute;display:block}
.face-happy:before{width:128px;height:58px;left:41px;top:28px;background:
radial-gradient(circle at 12px 19px,#111 0 9px,transparent 10px),
radial-gradient(circle at 116px 19px,#111 0 9px,transparent 10px),
linear-gradient(165deg,transparent 0 44%,#111 45% 49%,transparent 50%) 2px 0/45px 18px no-repeat,
linear-gradient(15deg,transparent 0 44%,#111 45% 49%,transparent 50%) 80px 0/45px 18px no-repeat}
.face-happy:after{width:78px;height:42px;left:66px;top:76px;border-bottom:8px solid #111;border-radius:0 0 70px 70px;box-shadow:0 10px 0 -6px #111}
.face-surprised:before{width:128px;height:58px;left:41px;top:27px;background:
radial-gradient(circle at 12px 24px,#111 0 10px,transparent 11px),
radial-gradient(circle at 116px 24px,#111 0 10px,transparent 11px),
linear-gradient(160deg,transparent 0 43%,#111 44% 50%,transparent 51%) 0 0/48px 18px no-repeat,
linear-gradient(20deg,transparent 0 43%,#111 44% 50%,transparent 51%) 80px 0/48px 18px no-repeat}
.face-surprised:after{width:34px;height:44px;left:88px;top:82px;border:7px solid #111;border-radius:50%}
.face-silly:before{width:130px;height:58px;left:39px;top:27px;background:
radial-gradient(ellipse at 12px 20px,#111 0 9px,transparent 10px),
radial-gradient(ellipse at 118px 15px,#111 0 9px,transparent 10px),
linear-gradient(8deg,transparent 0 44%,#111 45% 51%,transparent 52%) 0 0/50px 18px no-repeat,
linear-gradient(-12deg,transparent 0 44%,#111 45% 51%,transparent 52%) 80px 0/50px 18px no-repeat}
.face-silly:after{width:88px;height:38px;left:61px;top:79px;border-top:8px solid #111;border-radius:50%;transform:rotate(-6deg);box-shadow:0 8px 0 -4px #111}
.face-excited:before{width:132px;height:60px;left:39px;top:25px;background:
radial-gradient(ellipse at 13px 23px,#111 0 8px,transparent 9px),
radial-gradient(ellipse at 119px 23px,#111 0 8px,transparent 9px),
linear-gradient(155deg,transparent 0 42%,#111 43% 50%,transparent 51%) 0 0/48px 18px no-repeat,
linear-gradient(25deg,transparent 0 42%,#111 43% 50%,transparent 51%) 84px 0/48px 18px no-repeat}
.face-excited:after{width:82px;height:50px;left:64px;top:78px;border:8px solid #111;border-radius:50%;box-shadow:inset 0 -7px 0 -2px #111}
.face-label{position:absolute;bottom:12px;left:10px;right:10px;text-align:center;font-size:clamp(22px,2.3vw,34px);font-weight:bold}
.scan-bottom{flex:0 0 auto;text-align:center;font-size:clamp(19px,2vw,28px);font-weight:bold;padding:8px}
.game{background:linear-gradient(#9ee8ff 0%,#e9fbff 75%,#b7e98f 75%,#b7e98f 100%);position:relative}
.game-top{position:absolute;left:20px;right:20px;top:15px;display:flex;justify-content:space-between;align-items:center;font-size:clamp(20px,2vw,28px);font-weight:bold;z-index:10}
.cloud{position:absolute;background:rgba(255,255,255,.88);border-radius:50%;z-index:0}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud1{width:180px;height:55px;top:16%;left:10%}.cloud1:before{width:80px;height:80px;left:28px;top:-38px}.cloud1:after{width:95px;height:95px;left:82px;top:-52px}.cloud2{width:210px;height:62px;top:29%;right:8%}.cloud2:before{width:90px;height:90px;left:35px;top:-44px}.cloud2:after{width:105px;height:105px;left:105px;top:-58px}.cloud3{width:140px;height:45px;top:9%;left:60%}.cloud3:before{width:62px;height:62px;left:20px;top:-30px}.cloud3:after{width:72px;height:72px;left:65px;top:-38px}
#gameArea{position:absolute;inset:70px 0 0 0;overflow:hidden}
#cactus{position:absolute;left:28%;top:28%;width:300px;height:340px;z-index:3;filter:drop-shadow(0 8px 6px rgba(0,0,0,.2));display:flex;align-items:center;justify-content:center;pointer-events:none}
#cactus img{display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom}
#balloon{position:absolute;left:50%;top:calc(66% - 2in);width:190px;height:240px;transform:translate(-50%,-50%) scale(.28);transform-origin:center center;border-radius:50% 50% 47% 47%;z-index:2;box-shadow:inset -24px -20px 34px rgba(0,0,0,.16),inset 18px 15px 25px rgba(255,255,255,.42),0 12px 18px rgba(0,0,0,.18);transition:background .2s}
#balloon:before{content:"";position:absolute;left:50%;bottom:-23px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:25px solid var(--balloon-color)}
#balloon:after{content:"";position:absolute;left:50%;bottom:-130px;transform:translateX(-50%);width:4px;height:110px;background:#555}
.face-on-balloon{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:120px;height:92px;font-size:0}
.face-on-balloon:before{content:"";position:absolute;left:24px;top:21px;width:72px;height:30px;background:
radial-gradient(circle at 8px 15px,#111 0 6px,transparent 7px),
radial-gradient(circle at 64px 15px,#111 0 6px,transparent 7px),
linear-gradient(165deg,transparent 0 43%,#111 44% 50%,transparent 51%) 0 0/30px 12px no-repeat,
linear-gradient(15deg,transparent 0 43%,#111 44% 50%,transparent 51%) 42px 0/30px 12px no-repeat}
.face-on-balloon:after{content:"";position:absolute;left:39px;top:51px;width:42px;height:23px;border-bottom:5px solid #111;border-radius:0 0 45px 45px}
.face-on-balloon.face-surprised:after{width:22px;height:24px;left:49px;top:49px;border:5px solid #111;border-radius:50%}
.face-on-balloon.face-silly:after{left:34px;top:54px;width:52px;height:10px;border-top:5px solid #111;border-radius:50%;transform:rotate(-7deg);box-shadow:0 8px 0 -4px #111}
.face-on-balloon.face-excited:before{background:
radial-gradient(ellipse at 8px 15px,#111 0 6px,transparent 7px),
radial-gradient(ellipse at 64px 15px,#111 0 6px,transparent 7px),
linear-gradient(155deg,transparent 0 42%,#111 43% 50%,transparent 51%) 0 0/30px 12px no-repeat,
linear-gradient(25deg,transparent 0 42%,#111 43% 50%,transparent 51%) 42px 0/30px 12px no-repeat}
.face-on-balloon.face-excited:after{width:48px;height:28px;left:36px;top:50px;border:5px solid #111;border-radius:50%}
#tapCount{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:clamp(24px,2.5vw,36px);font-weight:bold;background:rgba(255,255,255,.85);padding:8px 18px;border-radius:14px;z-index:8}
#modeHint{position:absolute;right:20px;bottom:18px;font-size:22px;font-weight:bold;background:rgba(255,255,255,.75);padding:8px 14px;border-radius:12px;z-index:8}
.explosion-ray{position:absolute;width:18px;height:165px;background:#ffcc00;transform-origin:50% 100%;z-index:9;clip-path:polygon(50% 0,100% 100%,50% 78%,0 100%);filter:drop-shadow(0 0 5px rgba(255,180,0,.7))}
.explosion-particle{position:absolute;width:22px;height:22px;border-radius:50%;pointer-events:none;z-index:9;box-shadow:0 0 8px rgba(255,70,30,.45)}
.effect-item{position:absolute;pointer-events:none;z-index:12;will-change:transform,opacity}
.effect-item{position:absolute;pointer-events:none;z-index:12;will-change:transform,opacity}
.water-drop{width:24px;height:34px;background:linear-gradient(135deg,#dffcff 0 14%,#38a9ff 28%,#0876df 100%);border-radius:58% 42% 58% 42%;box-shadow:inset 5px 4px 6px rgba(255,255,255,.8),0 0 8px rgba(0,180,255,.5)}
.water-drop:after{content:"";position:absolute;width:7px;height:10px;left:5px;top:5px;border-radius:50%;background:rgba(255,255,255,.75)}
.confetti-piece{width:18px;height:34px;border-radius:3px;box-shadow:0 2px 5px rgba(0,0,0,.18)}
.star-piece{font-size:50px;line-height:1;color:#ffd21f;text-shadow:0 0 7px #fff,0 0 16px #ffd21f}
.slime-piece{width:48px;height:34px;background:linear-gradient(145deg,#e0a0ff 0 12%,#b84dff 32%,#6d16bd 100%);border-radius:55% 45% 52% 48%;box-shadow:inset 8px 6px 10px rgba(255,255,255,.55),0 5px 10px rgba(76,0,120,.38);position:relative}
.slime-piece:after{content:"";position:absolute;left:11px;bottom:-25px;width:26px;height:31px;background:linear-gradient(160deg,#b84dff,#7418c5);border-radius:48% 52% 65% 65%;clip-path:polygon(0 0,100% 0,82% 62%,58% 78%,50% 100%,39% 76%,16% 68%)}
.sparkle-piece{font-size:50px;line-height:1;color:#ff4fa3;text-shadow:0 0 8px #fff,0 0 18px #ff4fa3}

#gameBack{position:absolute;left:18px;bottom:18px;z-index:30;border:2px solid #666;border-radius:10px;padding:10px 16px;background:#fff;font-weight:bold}
.hidden{display:none!important}
@media(max-width:800px){.setup-options{grid-template-columns:1fr}.scan-grid{grid-template-columns:repeat(2,1fr);gap:14px;padding:8px}.scan-choice:last-child{grid-column:1/-1}}
</style>
</head>
<body>

<section id="setupScreen" class="screen center">
  <h1>Balloon Pop Switch Game</h1>
  <div class="panel">
    <h2>Choose How the Switch Will Work</h2>
    <p class="instructions">The Space bar is the switch.</p>
    <div class="setup-options">
      <button class="setup-btn" data-mode="hold">HOLD
        <small>Hold Space to keep inflating. Let go and the balloon slowly shrinks.</small>
      </button>
      <button class="setup-btn" data-mode="tap">TAP
        <small>Press Space 4 times to inflate the balloon enough to pop.</small>
      </button>
      <button class="setup-btn" data-mode="either">EITHER
        <small>Hold Space or tap Space. The balloon stays inflated when you let go.</small>
      </button>
    </div>
  </div>
</section>

<section id="colorScreen" class="screen hidden">
  <div class="scan-header">
    <h1>Choose a Balloon Color</h1>
    <p class="instructions">The yellow glow shows the current choice. Press SPACE to choose.</p>
  </div>
  <div id="colorGrid" class="scan-grid"></div>
  <div class="scan-bottom">SPACE = SELECT</div>
</section>

<section id="faceScreen" class="screen hidden">
  <div class="scan-header">
    <h1>Choose a Face</h1>
    <p class="instructions">The yellow glow shows the current choice. Press SPACE to choose.</p>
  </div>
  <div id="faceGrid" class="scan-grid"></div>
  <div class="scan-bottom">SPACE = SELECT</div>
</section>

<section id="gameScreen" class="screen game hidden">
  <div class="game-top">
    <span id="modeLabel"></span>
    <span id="gameInstruction"></span>
  </div>
  <div class="cloud cloud1"></div><div class="cloud cloud2"></div><div class="cloud cloud3"></div><div id="gameArea">
    <div id="cactus"><img src="saguaro.png" alt="Saguaro cactus"></div>
    <div id="balloon"><div id="faceOnBalloon" class="face-on-balloon"></div></div>
    <div id="tapCount"></div>
    <div id="modeHint"></div>
    </div>
  </div>
  <button id="gameBack">BACK</button>
</section>

<audio id="popSound" preload="auto" src="Fruit/bomb_explode.mp3"></audio>

<script>
const COLORS=[
  {name:"Red",value:"#f5222d"},
  {name:"Blue",value:"#2787ff"},
  {name:"Green",value:"#28b84b"},
  {name:"Yellow",value:"#ffd21f"},
  {name:"Purple",value:"#9b4dff"},
  {name:"Pink",value:"#ff4fa3"}
];
const FACES=[
  {name:"Happy",emoji:"😀"},
  {name:"Surprised",emoji:"😮"},
  {name:"Silly",emoji:"😜"},
  {name:"Excited",emoji:"🤩"}
];

let mode="hold", selectedColor=null, selectedFace=null;
let scanTimer=null, scanIndex=0, scanItems=[];
let balloonSize=.28, held=false, tapCount=0, popped=false, lastTime=0, animationId=null;
let returnTimer=null, gameSession=0;
let popAudio=document.getElementById("popSound");
let audioUnlocked=false;
function unlockPopAudio(){
  if(audioUnlocked)return;
  audioUnlocked=true;
  try{
    popAudio.muted=true;
    const p=popAudio.play();
    if(p)p.then(()=>{popAudio.pause();popAudio.currentTime=0;popAudio.muted=false}).catch(()=>{popAudio.muted=false});
  }catch(e){popAudio.muted=false}
}

function show(id){
  document.querySelectorAll(".screen").forEach(x=>x.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

function buildColorMenu(){
  const grid=document.getElementById("colorGrid");
  grid.innerHTML=COLORS.map((c,i)=>`<button class="scan-choice" data-index="${i}" aria-label="${c.name}">
    <span class="number">${i+1}</span>
    <span class="color-balloon" style="background:${c.value};color:${c.value}"></span>
    <span class="choice-label">${c.name}</span>
  </button>`).join("");
}
function buildFaceMenu(){
  const grid=document.getElementById("faceGrid");
  grid.innerHTML=FACES.map((f,i)=>`<button class="scan-choice" data-index="${i}" aria-label="${f.name}">
    <span class="number">${i+1}</span>
    <span class="face face-${f.name.toLowerCase()}"></span>
    <span class="face-label">${f.name}</span>
  </button>`).join("");
}

function stopScan(){
  if(scanTimer){clearInterval(scanTimer);scanTimer=null}
  document.querySelectorAll(".scan-choice").forEach(x=>x.classList.remove("scanning"));
}
function startScan(gridId,items,onSelect){
  stopScan();
  scanItems=items;scanIndex=0;
  const choices=[...document.querySelectorAll("#"+gridId+" .scan-choice")];
  if(!choices.length)return;
  choices.forEach((choice,i)=>{choice.addEventListener("click",()=>{scanIndex=i;stopScan();onSelect(scanItems[i])})});
  const highlight=()=>{
    choices.forEach((x,i)=>x.classList.toggle("scanning",i===scanIndex));
  };
  highlight();
  scanTimer=setInterval(()=>{
    scanIndex=(scanIndex+1)%choices.length;
    highlight();
  },1400);
  window.currentScanSelect=()=>{
    stopScan();
    onSelect(scanItems[scanIndex]);
  };
}

function chooseInflationMode(newMode){
  if(!["hold","tap","either"].includes(newMode)) return;
  mode=newMode;
  selectedColor=null;
  selectedFace=null;
  cancelAnimationFrame(animationId);
  if(returnTimer){clearTimeout(returnTimer);returnTimer=null}
  gameSession++;
  held=false;
  popped=false;
  tapCount=0;
  balloonSize=.28;
  clearEffects();
  balloon.style.display="block";
  balloon.style.visibility="visible";
  balloon.style.opacity="1";
  startColorScan();
}

function startColorScan(){
  stopScan();
  show("colorScreen");
  scanPhase="color";
  scanIndex=0;
  const choices=[...document.querySelectorAll("#colorGrid .scan-choice")];
  if(!choices.length)return;

  const selectColor=()=>{
    const index=scanIndex;
    const chosen=COLORS[index];
    if(!chosen)return;
    selectedColor=chosen;
    stopScan();
    startFaceScan();
  };

  choices.forEach((choice,i)=>{
    choice.onclick=()=>{
      scanIndex=i;
      selectColor();
    };
  });

  window.currentScanSelect=selectColor;

  const highlight=()=>{
    choices.forEach((x,i)=>x.classList.toggle("scanning",i===scanIndex));
  };
  highlight();
  scanTimer=setInterval(()=>{
    if(scanPhase!=="color"){stopScan();return}
    scanIndex=(scanIndex+1)%choices.length;
    highlight();
  },1400);
}
function startFaceScan(){
  stopScan();
  show("faceScreen");
  scanPhase="face";
  scanIndex=0;
  const choices=[...document.querySelectorAll("#faceGrid .scan-choice")];
  if(!choices.length)return;

  const selectFace=()=>{
    const index=scanIndex;
    const chosen=FACES[index];
    if(!chosen)return;
    selectedFace=chosen;
    stopScan();
    startGame();
  };

  choices.forEach((choice,i)=>{
    choice.onclick=()=>{
      scanIndex=i;
      selectFace();
    };
  });

  window.currentScanSelect=selectFace;

  const highlight=()=>{
    choices.forEach((x,i)=>x.classList.toggle("scanning",i===scanIndex));
  };
  highlight();
  scanTimer=setInterval(()=>{
    if(scanPhase!=="face"){stopScan();return}
    scanIndex=(scanIndex+1)%choices.length;
    highlight();
  },1400);
}

function startGame(){
  if(!selectedColor || !selectedColor.value){
    startColorScan();
    return;
  }
  if(!selectedFace || !selectedFace.name){
    startFaceScan();
    return;
  }

  show("gameScreen");
  unlockPopAudio();

  if(returnTimer){clearTimeout(returnTimer);returnTimer=null}
  cancelAnimationFrame(animationId);

  gameSession++;
  held=false;
  popped=false;
  tapCount=0;
  balloonSize=.28;

  document.getElementById("modeLabel").textContent="Mode: "+mode.toUpperCase();
  document.getElementById("gameInstruction").textContent="SPACE = INFLATE";
  document.getElementById("modeHint").textContent=
    mode==="hold"?"Hold SPACE to inflate • Release to shrink":
    mode==="tap"?"Press SPACE 4 times":
    "Hold or tap SPACE";
  document.getElementById("tapCount").textContent=mode==="tap"?"0 / 4":"";

  clearEffects();

  // The selected color is the single source of truth for the balloon.
  balloon.style.setProperty("--balloon-color",selectedColor.value);
  balloon.style.backgroundColor=selectedColor.value;
  balloon.style.display="block";
  balloon.style.visibility="visible";
  balloon.style.opacity="1";
  balloon.style.transform="translate(-50%,-50%) scale(.28)";
  balloon.style.zIndex="20";

  document.getElementById("faceOnBalloon").className=
    "face-on-balloon face-"+selectedFace.name.toLowerCase();

  void balloon.offsetWidth;
  lastTime=performance.now();
  animationId=requestAnimationFrame(gameLoop);
}

function gameLoop(now){
  const dt=Math.min(.04,(now-lastTime)/1000);lastTime=now;
  if(!popped){
    if((mode==="hold"||mode==="either") && held) balloonSize+=dt*.23;
    if(mode==="hold" && !held) balloonSize-=dt*.075;
    balloonSize=Math.max(.28,Math.min(1.62,balloonSize));
    document.getElementById("balloon").style.transform=
      `translate(-50%,-50%) scale(${balloonSize})`;
    const balloon=document.getElementById("balloon");
    const br=balloon.getBoundingClientRect();
    // Use a fixed collision point instead of the PNG's box.
    // This point is positioned at the visible cactus/spike area.
    const gameArea=document.getElementById("gameArea").getBoundingClientRect();
    const collisionX=gameArea.left + gameArea.width*0.425 - 3;
    const collisionY=gameArea.top + gameArea.height*0.44;
    const pointSize=10;
    const balloonTouchesPoint =
      br.left <= collisionX + pointSize &&
      br.right >= collisionX - pointSize &&
      br.top <= collisionY + pointSize &&
      br.bottom >= collisionY - pointSize;
    if(balloonTouchesPoint) popBalloon();
  }
  if(!popped) animationId=requestAnimationFrame(gameLoop);
}

function activateSwitch(){
  unlockPopAudio();
  if(popped)return;
  if(mode==="tap"){
    tapCount=Math.min(4,tapCount+1);
    balloonSize=Math.min(1.62,.28+tapCount*.27);
    document.getElementById("tapCount").textContent=tapCount+" / 4";
    if(tapCount>=4)popBalloon();
  }else if(mode==="either"){
    held=true;
    balloonSize=Math.min(1.62,balloonSize+.12);
    if(balloonSize>=1.62)popBalloon();
  }else if(mode==="hold"){
    held=true;
  }
}

function releaseSwitch(){
  if(mode==="hold"||mode==="either")held=false;
}

function popBalloon(){
  if(popped)return;
  popped=true;held=false;
  const session=gameSession;
  const balloon=document.getElementById("balloon"),rect=balloon.getBoundingClientRect();
  const area=document.getElementById("gameArea"),ar=area.getBoundingClientRect();
  const cx=rect.left+rect.width/2-ar.left,cy=rect.top+rect.height/2-ar.top;
  try{popAudio.currentTime=0;const p=popAudio.play();if(p)p.catch(()=>{})}catch(e){}
  balloon.style.opacity="0";
  explosion(cx,cy);
  // Effects run for about 1.3 seconds; wait another 3 seconds after they finish.
  if(returnTimer)clearTimeout(returnTimer);
  returnTimer=setTimeout(()=>{
    returnTimer=null;
    if(popped && session===gameSession){
      popped=false;
      held=false;
      balloonSize=.28;
      balloon.style.opacity="1";
      startColorScan();
    }
  },4300);
}
function explosion(cx,cy){
  if(!selectedColor || !selectedColor.name) return;

  switch(selectedColor.name){
    case "Red": redBang(cx,cy); break;
    case "Blue": blueWater(cx,cy); break;
    case "Green": greenConfetti(cx,cy); break;
    case "Yellow": yellowStars(cx,cy); break;
    case "Purple": purpleSlime(cx,cy); break;
    case "Pink": pinkSparkles(cx,cy); break;
  }
}
function makeEffect(cls,text,cx,cy){
  const e=document.createElement("div");e.className="effect-item "+cls;if(text)e.textContent=text;
  e.style.left=(cx??document.getElementById("gameArea").clientWidth/2)+"px";
  e.style.top=(cy??document.getElementById("gameArea").clientHeight*.45)+"px";
  document.getElementById("gameArea").appendChild(e);return e;
}
function animateEffect(e,dx,dy,life,gravity,rotate){
  const st=performance.now();
  function step(t){const q=Math.min(1,(t-st)/life);
    e.style.transform=`translate(${dx*q}px,${dy*q+gravity*q*q}px) rotate(${rotate*q}deg) scale(${1-.35*q})`;
    e.style.opacity=1-q;if(q<1)requestAnimationFrame(step);else e.remove()}
  requestAnimationFrame(step);
}
function impactFlash(cx,cy,color,size=190){
  const area=document.getElementById("gameArea"),f=document.createElement("div");
  f.style.cssText=`position:absolute;left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff 0 9%,rgba(255,255,255,.95) 12%,${color} 30%,transparent 70%);filter:blur(1px);z-index:11;pointer-events:none`;
  area.appendChild(f);setTimeout(()=>f.remove(),230);
}
function redBang(cx,cy){
  const area=document.getElementById("gameArea"),colors=["#ff2418","#ff5638","#ff8a00","#ffd21f","#fff"];
  impactFlash(cx,cy,"#ff2d20",230);
  for(let i=0;i<34;i++){const r=document.createElement("div");r.className="explosion-ray";r.style.left=cx+"px";r.style.top=cy+"px";r.style.background=colors[i%colors.length];r.style.transform=`translate(-50%,-100%) rotate(${i*(360/34)}deg) scaleY(.35)`;area.appendChild(r);setTimeout(()=>r.remove(),850)}
  for(let i=0;i<75;i++){const p=makeEffect("explosion-particle",null,cx,cy),a=Math.random()*6.28,s=120+Math.random()*460; p.style.background=colors[Math.floor(Math.random()*colors.length)];animateEffect(p,Math.cos(a)*s,Math.sin(a)*s,1200,230,Math.random()*720-360)}
}
function blueWater(cx,cy){
  impactFlash(cx,cy,"#20a8ff",210);
  for(let i=0;i<12;i++){const e=makeEffect("water-drop",null,cx+(Math.random()-0.5)*25,cy+(Math.random()-0.5)*20),a=Math.random()*6.28,s=120+Math.random()*240;animateEffect(e,Math.cos(a)*s,Math.sin(a)*s-130,1150,360,Math.random()*180-90)}
  for(let i=0;i<26;i++){const e=makeEffect("water-drop",null,cx,cy),a=Math.random()*6.28,s=70+Math.random()*330;animateEffect(e,Math.cos(a)*s,Math.sin(a)*s-70,1250,420,Math.random()*120-60)}
}
function greenConfetti(cx,cy){
  impactFlash(cx,cy,"#39d66b",210);
  const colors=["#19a94a","#39d66b","#7cf27f","#0b7d38","#b8ff8a"];
  for(let i=0;i<65;i++){const e=makeEffect("confetti-piece",null,cx,cy);e.style.background=colors[Math.floor(Math.random()*colors.length)];e.style.width=(10+Math.random()*13)+"px";e.style.height=(18+Math.random()*24)+"px";const a=Math.random()*6.28,s=90+Math.random()*360;animateEffect(e,Math.cos(a)*s,Math.sin(a)*s-120,1400,430,Math.random()*900-450)}
}
function yellowStars(cx,cy){
  impactFlash(cx,cy,"#ffd21f",220);
  for(let i=0;i<10;i++){const e=makeEffect("star-piece","✦",cx,cy),a=Math.random()*6.28,s=80+Math.random()*180;animateEffect(e,Math.cos(a)*s,Math.sin(a)*s-80,1050,190,Math.random()*500-250)}
  for(let i=0;i<16;i++){const e=makeEffect("star-piece","★",cx,cy),a=Math.random()*6.28,s=120+Math.random()*300;animateEffect(e,Math.cos(a)*s,Math.sin(a)*s-120,1300,240,Math.random()*500-250)}
}
function purpleSlime(cx,cy){
  impactFlash(cx,cy,"#a63cff",220);
  for(let i=0;i<8;i++){const e=makeEffect("slime-piece",null,cx+(Math.random()-0.5)*30,cy+(Math.random()-0.5)*24);e.style.width=(40+Math.random()*28)+"px";e.style.height=(28+Math.random()*22)+"px";const a=Math.random()*6.28,s=55+Math.random()*150;animateEffect(e,Math.cos(a)*s,Math.sin(a)*s-55,1500,430,Math.random()*120-60)}
  for(let i=0;i<12;i++){const e=makeEffect("slime-piece",null,cx,cy),a=Math.random()*6.28,s=80+Math.random()*260;animateEffect(e,Math.cos(a)*s,Math.sin(a)*s-45,1550,500,Math.random()*120-60)}
}
function pinkSparkles(cx,cy){
  impactFlash(cx,cy,"#ff4fa3",220);
  for(let i=0;i<22;i++){const e=makeEffect("sparkle-piece",i%3===0?"✦":"✧",cx,cy),a=Math.random()*6.28,s=80+Math.random()*300;animateEffect(e,Math.cos(a)*s,Math.sin(a)*s-100,1350,210,Math.random()*500-250)}
}

document.querySelectorAll(".setup-btn").forEach(btn=>{
  btn.addEventListener("click",()=>chooseInflationMode(btn.dataset.mode));
});

let setupIndex=0;
function setupSelect(){
  const buttons=[...document.querySelectorAll(".setup-btn")];
  if(!buttons.length)return;
  chooseInflationMode(buttons[setupIndex].dataset.mode);
}

window.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    e.preventDefault();
    cancelAnimationFrame(animationId);
    if(returnTimer){clearTimeout(returnTimer);returnTimer=null}
    gameSession++;
    popped=false;held=false;
    stopScan();
    if(!document.getElementById("gameScreen").classList.contains("hidden")){
      startFaceScan();
    }else if(!document.getElementById("faceScreen").classList.contains("hidden")){
      startColorScan();
    }else if(!document.getElementById("colorScreen").classList.contains("hidden")){
      show("setupScreen");
    }else{
      show("setupScreen");
    }
    return;
  }
  if(e.code!=="Space")return;
  e.preventDefault();
  if(e.repeat)return;
  if(!document.getElementById("setupScreen").classList.contains("hidden")){
    setupSelect();
    return;
  }
  if(!document.getElementById("colorScreen").classList.contains("hidden") ||
     !document.getElementById("faceScreen").classList.contains("hidden")){
    if(typeof window.currentScanSelect==="function")window.currentScanSelect();
    return;
  }
  if(!document.getElementById("gameScreen").classList.contains("hidden"))activateSwitch();
});
window.addEventListener("keyup",e=>{
  if(e.code!=="Space")return;
  e.preventDefault();
  if(!document.getElementById("gameScreen").classList.contains("hidden"))releaseSwitch();
});

document.getElementById("gameBack").addEventListener("click",()=>{
  cancelAnimationFrame(animationId);
  if(returnTimer){clearTimeout(returnTimer);returnTimer=null}
  gameSession++;
  popped=false;held=false;
  document.getElementById("balloon").style.opacity="1";
  stopScan();show("setupScreen");
});

buildColorMenu();buildFaceMenu();
</script>
</body>
</html>
