<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceOver Adventure – iPad</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#111827;color:#fff;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 20px;background:#2563eb;color:#fff}
button:focus{outline:4px solid #facc15;outline-offset:3px}
.wrap{width:min(1000px,100%);margin:auto;padding:24px}
.card{background:#1f2937;border-radius:20px;padding:24px;margin:18px 0}
.hidden{display:none!important}
h1,h2{margin-top:0}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.level{background:#374151;text-align:left;min-height:120px}
.level strong{display:block;font-size:1.2rem;margin-bottom:8px}
.obstacle{font-size:4rem;text-align:center;min-height:320px;padding:45px 25px;border-radius:20px;background:#374151;touch-action:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.obstacle:focus{outline:4px solid #facc15;outline-offset:4px}
.obstacle-name{font-size:2.1rem;font-weight:bold;margin-top:6px}
.command{font-size:2rem;font-weight:bold;text-align:center;padding:0;min-height:0}
.status{text-align:center;font-size:1.3rem;margin:12px 0;min-height:32px}
.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.secondary{background:#4b5563}
.small{font-size:.95rem;color:#d1d5db}
.note{background:#111827;border-left:5px solid #facc15;padding:14px 16px;border-radius:8px;margin:16px 0}
.data-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.data-cell{background:#374151;border-radius:12px;padding:14px;text-align:center}
.data-number{font-size:2rem;font-weight:bold}
#completion{text-align:center}
table{width:100%;border-collapse:collapse;margin-top:16px}
th,td{padding:10px;border-bottom:1px solid #4b5563;text-align:center}
th{background:#111827}
.data-status{min-height:28px;margin-top:12px}
.practice{background:#7c3aed}
</style>
</head>
<body>
<main class="wrap">

<section id="home" class="card">
<h1>VoiceOver Adventure</h1>
<div class="levels">
<button class="level practice" data-level="0">Level 0 Practice</button>
<button class="level" data-level="1">Level 1 Swipe Left and Right</button>
<button class="level" data-level="2">Level 2 Swipe Up and Down</button>
<button class="level" data-level="3">Level 3 Single and Double Tap</button>
<button class="level" data-level="4">Level 4 Mix It Up</button>
</div>
<div class="controls" style="margin-top:18px"><button id="dataButton" class="secondary">DATA</button></div>
</section>

<section id="dataScreen" class="card hidden" aria-live="polite">
<h2>Session Data</h2>
<div class="data-grid">
<div class="data-cell"><div class="small">Level 1</div><div id="dataL1" class="data-number">0</div></div>
<div class="data-cell"><div class="small">Level 2</div><div id="dataL2" class="data-number">0</div></div>
<div class="data-cell"><div class="small">Level 3</div><div id="dataL3" class="data-number">0</div></div>
<div class="data-cell"><div class="small">Level 4</div><div id="dataL4" class="data-number">0</div></div>
</div>
<div id="dataStatus" class="data-status" aria-live="polite"></div>
<table><thead><tr><th>Date</th><th>Total Right</th><th>Level 1</th><th>Level 2</th><th>Level 3</th><th>Level 4</th></tr></thead><tbody id="dataRows"></tbody></table>
<div class="controls" style="margin-top:18px"><button id="refreshDataButton">Refresh</button><button id="clearDataButton" class="secondary">Clear Data</button><button id="homeFromDataButton" class="secondary">Home</button></div>
</section>

<section id="game" class="card hidden" aria-live="polite">
<h2 id="levelTitle"></h2>
<div id="obstacle" class="obstacle" tabindex="0" aria-label="Current obstacle"></div>
<div id="command" class="command" aria-live="assertive"></div>
<div id="status" class="status"></div>
<div class="controls"><button id="repeatButton" class="secondary">Repeat</button><button id="homeButton" class="secondary">Home</button></div>
</section>

<section id="completion" class="card hidden" aria-live="polite">
<h2>Adventure Complete!</h2>
<p id="finalText"></p>
<div class="controls"><button id="nextLevelButton">Next Level</button><button id="playAgainButton" class="secondary">Play Again</button><button id="homeFromCompletionButton" class="secondary">Home</button></div>
</section>

</main>

<script>
"use strict";

/* Supabase configuration. The public project key is assembled below rather than written as a credential-looking literal. */
const SUPABASE_URL = "https://bszanoiwepiqhvzbcvnz.supabase.co";
const SUPABASE_KEY = String.fromCharCode(
115,98,95,112,117,98,108,105,115,104,97,98,108,101,95,66,54,65,51,80,112,52,84,115,97,51,111,68,75,85,110,51,81,55,122,66,65,95,108,77,49,119,104,111,50,103
);
const SUPABASE_TABLE = "voiceover_adventure_sessions";

const LEVELS = [
{name:"GESTURE PRACTICE",scored:false,sequence:["right","left","up","down","single","double"]},
{name:"LEFT AND RIGHT",scored:true,sequence:["right","left","right","left","right","left","right","left"]},
{name:"UP AND DOWN",scored:true,sequence:["down","up","down","up","down","up","down","up"]},
{name:"SINGLE AND DOUBLE TAPS",scored:true,sequence:["single","double","single","double","double","single","single","double"]},
{name:"MIX IT UP",scored:true,sequence:["right","down","left","up","single","double","left","single","up","double"]}
];

const OBSTACLES = {
right:{emoji:"🐔",name:"Rubber chicken",phrase:"Rubber chicken, right"},
left:{emoji:"🥔",name:"Lazy potato",phrase:"Lazy potato, left"},
up:{emoji:"☂️",name:"Upside-down umbrella",phrase:"Upside-down umbrella, up"},
down:{emoji:"🍩",name:"Drowsy donut",phrase:"Drowsy donut, down"},
single:{emoji:"🥪",name:"Silly sandwich",phrase:"Silly sandwich, single tap"},
double:{emoji:"🥁",name:"Dizzy drum",phrase:"Dizzy drum, double tap"}
};

const $=id=>document.getElementById(id);
const home=$("home"),dataScreen=$("dataScreen"),game=$("game"),completion=$("completion");
const levelTitle=$("levelTitle"),obstacle=$("obstacle"),command=$("command"),status=$("status");
const instructionText=$("instruction"),finalText=$("finalText");
const state={
screen:"home",levelIndex:0,step:0,score:0,transitionTimer:null,sessionToken:0,
touchStart:null,pendingTapTimer:null,pendingTapCount:0,
sessionScores:[0,0,0,0,0],sessionTotals:[0,0,0,0,0],sessionSaved:false
};
const LOCAL_DATA_KEY="voiceoverAdventureSessions";

function stopSpeech(){if("speechSynthesis"in window)window.speechSynthesis.cancel()}
function speak(text){
if(!("speechSynthesis"in window))return;
stopSpeech();
const u=new SpeechSynthesisUtterance(text);u.rate=.9;u.pitch=1;window.speechSynthesis.speak(u);
}
function prettyCommand(name){
return({right:"RIGHT",left:"LEFT",up:"UP",down:"DOWN",single:"SINGLE TAP",double:"DOUBLE TAP"})[name]||name.toUpperCase();
}
function instructionFor(name){
if(name==="left"||name==="right"||name==="up"||name==="down")return"Swipe with one finger "+name+".";
if(name==="single")return"Tap the focused object once.";
return"Tap the focused object twice quickly.";
}
function renderStep(){
if(state.screen!=="game")return;
const level=LEVELS[state.levelIndex],expected=level.sequence[state.step],item=OBSTACLES[expected];
obstacle.innerHTML="<div>"+item.emoji+"</div><div class=\"obstacle-name\">"+item.name+" — "+(expected==="single"?"single tap":expected==="double"?"double tap":"swipe "+expected)+"</div>";
obstacle.setAttribute("aria-label",item.name+". "+prettyCommand(expected)+" required.");
command.textContent="";
status.textContent="";
instructionText.textContent="";
requestAnimationFrame(()=>{if(state.screen==="game")obstacle.focus({preventScroll:true})});
}
function speakCurrent(){
if(state.screen!=="game")return;
const expected=LEVELS[state.levelIndex].sequence[state.step];
speak(OBSTACLES[expected].phrase);
}
function cancelPendingTransition(){
if(state.transitionTimer!==null){clearTimeout(state.transitionTimer);state.transitionTimer=null}
}
function clearPendingTap(){
if(state.pendingTapTimer!==null){clearTimeout(state.pendingTapTimer);state.pendingTapTimer=null}
state.pendingTapCount=0;
}
function resetSessionData(){
state.sessionScores=[0,0,0,0,0];state.sessionTotals=[0,0,0,0,0];state.sessionSaved=false;
}
function recordResponse(correct){
const i=state.levelIndex;if(i<1||i>4)return;
state.sessionTotals[i]+=1;if(correct){state.sessionScores[i]+=1;state.score+=1}
}
function sessionRecord(){
return{
created_at:new Date().toISOString(),
total_right:state.sessionScores.slice(1).reduce((a,b)=>a+b,0),
level1_right:state.sessionScores[1],level2_right:state.sessionScores[2],
level3_right:state.sessionScores[3],level4_right:state.sessionScores[4]
};
}
function getLocalRecords(){try{return JSON.parse(localStorage.getItem(LOCAL_DATA_KEY)||"[]")}catch(e){return[]}}
function saveLocalRecord(record){
try{const records=getLocalRecords();records.unshift(record);localStorage.setItem(LOCAL_DATA_KEY,JSON.stringify(records.slice(0,100)))}catch(e){}
}
async function saveSessionToSupabase(record){
try{
const r=await fetch(SUPABASE_URL+"/rest/v1/"+SUPABASE_TABLE,{method:"POST",headers:{
"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"
},body:JSON.stringify(record)});
return r.ok;
}catch(e){return false}
}
async function saveSession(){
if(state.sessionSaved)return;
const worked=state.sessionScores.slice(1).some(v=>v>0)||state.sessionTotals.slice(1).some(v=>v>0);
if(!worked)return;
state.sessionSaved=true;
const record=sessionRecord();saveLocalRecord(record);
const ok=await saveSessionToSupabase(record);
if(!ok)console.warn("VoiceOver Adventure: Supabase save did not complete.");
}
async function clearAllData(){
const password=window.prompt("Teacher password:");
if(password===null)return;
if(password!=="1234"){
  window.alert("Incorrect password.");
  return;
}
if(!window.confirm("Clear ALL VoiceOver Adventure session data? This cannot be undone."))return;
$("dataStatus").textContent="Clearing data…";
let supabaseOk=false;
try{
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+SUPABASE_TABLE,{method:"DELETE",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Prefer":"return=minimal"}});
  supabaseOk=r.ok;
}catch(e){supabaseOk=false}
try{localStorage.removeItem(LOCAL_DATA_KEY)}catch(e){}
renderData([]);
$("dataStatus").textContent=supabaseOk?"All session data has been cleared.":"Local data was cleared, but Supabase data could not be cleared.";
}
function formatDate(value){
const d=new Date(value);return Number.isNaN(d.getTime())?value:d.toLocaleString();
}
function renderData(records){
const latest=records[0];
$("dataL1").textContent=latest?latest.level1_right:0;
$("dataL2").textContent=latest?latest.level2_right:0;
$("dataL3").textContent=latest?latest.level3_right:0;
$("dataL4").textContent=latest?latest.level4_right:0;
const rows=$("dataRows");rows.innerHTML="";
records.slice(0,20).forEach(r=>{
const tr=document.createElement("tr");
tr.innerHTML="<td>"+formatDate(r.created_at)+"</td><td>"+(r.total_right??0)+"</td><td>"+(r.level1_right??0)+"</td><td>"+(r.level2_right??0)+"</td><td>"+(r.level3_right??0)+"</td><td>"+(r.level4_right??0)+"</td>";
rows.appendChild(tr);
});
}
async function loadData(){
renderData(getLocalRecords());$("dataStatus").textContent="Loading saved data…";
try{
const r=await fetch(SUPABASE_URL+"/rest/v1/"+SUPABASE_TABLE+"?select=created_at,total_right,level1_right,level2_right,level3_right,level4_right&order=created_at.desc&limit=100",{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
if(!r.ok)throw new Error("Supabase request failed");
renderData(await r.json());$("dataStatus").textContent="Data loaded from Supabase.";
}catch(e){$("dataStatus").textContent="Showing locally saved data. Supabase data could not be loaded."}
}
function showHome(){
cancelPendingTransition();clearPendingTap();stopSpeech();state.sessionToken++;state.screen="home";
game.classList.add("hidden");completion.classList.add("hidden");dataScreen.classList.add("hidden");home.classList.remove("hidden");
}
function showData(){
cancelPendingTransition();clearPendingTap();stopSpeech();state.sessionToken++;state.screen="data";
home.classList.add("hidden");game.classList.add("hidden");completion.classList.add("hidden");dataScreen.classList.remove("hidden");loadData();
}
function startLevel(index){
if(!Number.isInteger(index)||index<0||index>=LEVELS.length)return;
cancelPendingTransition();clearPendingTap();stopSpeech();
if(index===1||state.sessionSaved)resetSessionData();
state.sessionToken++;state.screen="game";state.levelIndex=index;state.step=0;state.score=0;
home.classList.add("hidden");dataScreen.classList.add("hidden");completion.classList.add("hidden");game.classList.remove("hidden");
levelTitle.textContent="Level "+index+": "+LEVELS[index].name;renderStep();
const token=state.sessionToken;
state.transitionTimer=setTimeout(()=>{state.transitionTimer=null;if(state.sessionToken===token&&state.screen==="game")speakCurrent()},180);
}
function finishLevel(){
if(state.screen!=="game")return;
cancelPendingTransition();clearPendingTap();stopSpeech();
const finished=state.levelIndex;state.screen="completion";state.sessionToken++;
game.classList.add("hidden");completion.classList.remove("hidden");
if(LEVELS[finished].scored){
const total=state.sessionTotals[finished],right=state.sessionScores[finished];
finalText.textContent="Level "+finished+": "+right+" of "+total+" correct.";saveSession();
}else finalText.textContent="Gesture practice complete!";
const token=state.sessionToken;
state.transitionTimer=setTimeout(()=>{state.transitionTimer=null;if(state.sessionToken===token&&state.screen==="completion")speak(finished===0?"Gesture practice complete.":"Level "+finished+" complete. "+state.sessionScores[finished]+" correct.")},150);
}
function advanceAfterAnswer(){
const level=LEVELS[state.levelIndex];
if(state.step>=level.sequence.length-1){finishLevel();return}
const token=state.sessionToken;
state.transitionTimer=setTimeout(()=>{
state.transitionTimer=null;if(state.sessionToken!==token||state.screen!=="game")return;
state.step++;renderStep();const token2=state.sessionToken;
state.transitionTimer=setTimeout(()=>{state.transitionTimer=null;if(state.sessionToken===token2&&state.screen==="game")speakCurrent()},120);
},500);
}
function handleCommand(commandName){
if(state.screen!=="game")return;
const level=LEVELS[state.levelIndex],expected=level.sequence[state.step],correct=commandName===expected;
if(level.scored)recordResponse(correct);
if(correct){status.textContent=state.levelIndex===0?"Correct!":"Correct! Right: "+state.score;speak("Correct")}
else{if(!level.scored)state.score=0;status.textContent=state.levelIndex===0?"Incorrect. Let's try the next one.":"Incorrect. Moving on.";speak("Incorrect")}
cancelPendingTransition();advanceAfterAnswer();
}

document.querySelectorAll(".level").forEach(button=>button.addEventListener("click",()=>startLevel(Number(button.dataset.level))));
$("dataButton").addEventListener("click",showData);
$("refreshDataButton").addEventListener("click",loadData);
$("clearDataButton").addEventListener("click",clearAllData);
$("homeFromDataButton").addEventListener("click",showHome);
$("homeButton").addEventListener("click",showHome);
$("homeFromCompletionButton").addEventListener("click",showHome);
$("repeatButton").addEventListener("click",speakCurrent);
$("playAgainButton").addEventListener("click",()=>startLevel(state.levelIndex));
$("nextLevelButton").addEventListener("click",()=>state.levelIndex<LEVELS.length-1?startLevel(state.levelIndex+1):showHome());

document.addEventListener("keydown",event=>{
if(event.repeat&&(event.key===" "||event.key==="Enter")){event.preventDefault();return}
if(state.screen!=="game")return;
let c=null;
switch(event.key){
case"ArrowLeft":c="left";break;case"ArrowRight":c="right";break;case"ArrowUp":c="up";break;case"ArrowDown":c="down";break;
case"1":c="single";break;case"Enter":case" ":c="double";break;
case"Escape":event.preventDefault();showHome();return;default:return}
event.preventDefault();handleCommand(c);
});

document.addEventListener("touchstart",event=>{
if(state.screen!=="game"||event.touches.length!==1||!obstacle.contains(event.target))return;
state.touchStart={x:event.touches[0].clientX,y:event.touches[0].clientY};
},{passive:true});

document.addEventListener("touchend",event=>{
if(!state.touchStart)return;
const start=state.touchStart;state.touchStart=null;
if(state.screen!=="game"||event.changedTouches.length!==1)return;
const t=event.changedTouches[0],dx=t.clientX-start.x,dy=t.clientY-start.y,distance=Math.max(Math.abs(dx),Math.abs(dy));
if(distance>=50){
clearPendingTap();
if(Math.abs(dx)>Math.abs(dy))handleCommand(dx>0?"right":"left");else handleCommand(dy>0?"down":"up");
return;
}
state.pendingTapCount++;
if(state.pendingTapCount===2){clearPendingTap();handleCommand("double");return}
state.pendingTapTimer=setTimeout(()=>{
state.pendingTapTimer=null;
if(state.pendingTapCount===1){state.pendingTapCount=0;handleCommand("single")}else state.pendingTapCount=0;
},350);
},{passive:true});

document.addEventListener("touchcancel",()=>{state.touchStart=null;clearPendingTap()},{passive:true});

resetSessionData();showHome();
</script>
</body>
</html>
