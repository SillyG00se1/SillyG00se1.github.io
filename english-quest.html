<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172b4d">
<title>Word Quest</title>
<style>
:root{color-scheme:light;--ink:#172b4d;--paper:#fff;--soft:#eef3f8;--line:#c8d2df;--accent:#174f86;--good:#17633b;--bad:#8a2e27}
*{box-sizing:border-box}
body{margin:0;background:#f4f6f9;color:var(--ink);font:18px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#172b4d;color:#fff;padding:18px max(18px,env(safe-area-inset-left));}
header h1{font-size:1.7rem;margin:0 0 8px}
header p{margin:0}
main{max-width:850px;margin:0 auto;padding:20px 16px 48px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 18px}
h2{font-size:1.35rem;line-height:1.3;margin:0 0 14px}
h3{font-size:1.1rem;margin:0 0 8px}
p{margin:0 0 12px}
button,input,textarea{font:inherit}
button{display:block;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--accent);border-radius:10px;background:#fff;color:var(--ink);margin:10px 0;min-height:54px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #f0b429;outline-offset:3px}
button.primary{background:var(--accent);color:#fff}
button:disabled{opacity:.55}
button.secondary{border-color:#66788d}
input,textarea{width:100%;border:2px solid #66788d;border-radius:10px;padding:13px;background:#fff;color:#172b4d;min-height:54px}
textarea{min-height:112px;resize:vertical}
label{display:block;font-weight:700;margin:14px 0 6px}
.small{font-size:.92rem;color:#40536b}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 13px}
.stat strong{display:block;font-size:1.1rem}
.progress{height:12px;background:#dce4ed;border-radius:20px;overflow:hidden;margin:8px 0 14px}
.progress span{display:block;height:100%;background:#17633b;width:0}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions button{flex:1 1 180px}
.feedback{padding:12px;border-left:5px solid var(--accent);background:var(--soft);margin:14px 0;border-radius:4px}
.feedback.good{border-color:var(--good)}
.feedback.bad{border-color:var(--bad)}
.hidden{display:none!important}
ul{padding-left:24px}
li{margin:6px 0}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media(min-width:650px){main{padding-top:28px}.panel{padding:26px}}
</style>
</head>
<body>
<header>
<h1>Word Quest</h1>
<p>Read, play, earn points, and unlock new things.</p>
</header>
<main id="main">
<section class="panel" aria-labelledby="welcomeTitle">
<h2 id="welcomeTitle">Welcome to Word Quest</h2>
<p>Build your English skills one mission at a time. You can take as long as you need.</p>
<button class="primary" id="startButton">Start a mission</button>
<button id="storeButton">Visit the store</button>
<button class="secondary" id="progressButton">My progress</button>
</section>
<section class="panel" id="statusPanel" aria-label="Your progress">
<div class="stats">
<div class="stat">Level<strong id="gradeStat">2</strong></div>
<div class="stat">Points<strong id="pointsStat">0</strong></div>
<div class="stat">Items owned<strong id="ownedStat">0</strong></div>
</div>
<p id="gradeDescription">Your learning starts here.</p>
<div class="progress" role="progressbar" aria-label="Progress toward the next level" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="gradeProgress"><span id="gradeProgressBar"></span></div>
<p class="small" id="progressDescription">Earn points by completing activities.</p>
</section>
<div id="view" aria-live="off"></div>
<div id="announcer" class="hidden" role="status" aria-live="polite" aria-atomic="true"></div>
</main>

function correct(){
if(answered)return;answered=true;sessionCorrect++;data.points+=10;data.totalCorrect++;data.correctByGrade[data.grade]=(data.correctByGrade[data.grade]||0)+1;
let unlocked=false;const threshold=thresholds[data.grade];if(threshold&&data.correctByGrade[data.grade]>=threshold){data.grade++;taskIndex=-1;unlocked=true}
save();
const msg=unlocked?"Correct. You earned 10 points. You unlocked level "+data.grade+".": "Correct. You earned 10 points.";
feedback(msg+" "+(currentTask.why||""),"good");
const buttons=$("view").querySelectorAll("#choices button, #answerForm button");buttons.forEach(b=>b.disabled=true);
const next=document.createElement("button");next.className="primary";next.textContent="Next question";next.addEventListener("click",()=>{taskIndex++;showTask()});
$("taskFeedback").after(next);next.focus();announce(msg);
}
function incorrect(){feedback("Not quite. Try again. You can ask for a hint.","bad");const input=$("answerInput");if(input)input.focus()}
function checkChoice(n){if(n===currentTask.a)correct();else incorrect()}
function normalize(s){return s.toLowerCase().trim().replace(/[.,!?;:'"]/g,"").replace(/\s+/g," ")}
function checkEntry(v){if(normalize(v)===normalize(currentTask.a))correct();else incorrect()}
function showHint(){if(!currentTask)return;let hint=currentTask.hint||currentTask.why||"Read the question again and look for an important clue.";feedback("Hint: "+hint,"");announce("Hint: "+hint)}
function showStore(){
currentActivity=null;let html='<section class="panel"><h2>Word Quest Store</h2><p>You have '+data.points+' points.</p><p>Choose an item to buy. Purchased items stay in your collection.</p><div id="storeItems"></div><hr><h3>Your collection</h3><ul>';
if(data.owned.length){data.owned.forEach(id=>{const p=products.find(x=>x.id===id);if(p)html+='<li>'+p.name+'</li>'})}else html+='<li>You have not bought anything yet.</li>';
html+='</ul><button class="secondary" id="storeBack">Back to activities</button></section>';$("view").innerHTML=html;
products.filter(p=>!data.owned.includes(p.id)).forEach(p=>{const b=document.createElement("button");b.textContent=p.name+". "+p.desc+" Cost: "+p.price+" points.";b.disabled=data.points<p.price;b.addEventListener("click",()=>buy(p));$("storeItems").appendChild(b)});
$("storeBack").onclick=showHome;focusHeading();
}
function buy(p){if(data.owned.includes(p.id)||data.points<p.price)return;data.points-=p.price;data.owned.push(p.id);save();announce("You bought "+p.name+".");showStore()}
function showProgress(){
currentActivity=null;const grade=data.grade;const correct=data.totalCorrect;
$("view").innerHTML='<section class="panel"><h2>My progress</h2><p>Current level: '+grade+'</p><p>Total correct answers: '+correct+'</p><p>Points available: '+data.points+'</p><p>Items in your collection: '+data.owned.length+'</p><h3>Skills you can practice</h3><ul>'+activities.map(a=>'<li>'+a.name+'</li>').join("")+'</ul><button id="progressStore">Visit the store</button><button class="secondary" id="progressBack">Back to activities</button></section>';
$("progressStore").onclick=showStore;$("progressBack").onclick=showHome;focusHeading();
}
$("startButton").onclick=showHome;$("storeButton").onclick=showStore;$("progressButton").onclick=showProgress;
updateStats();
})();
</script>
</body>
</html>
