}
function ninjaEndGame(reason){const s=ninjaState;if(!s||s.gameOver)return;s.gameOver=true;s.canRestart=false;ninjaMessage(reason);setTimeout(()=>{if(ninjaState===s)ninjaShowEndScreen()},700)}
function ninjaKey(e){const s=ninjaState;if(!s)return;if(e.target&&["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName))return;if(s.gameOver){if(e.code==="Space"&&s.canRestart)startNinjaReview(s.groupEnd);e.preventDefault();return}const typed=(e.key||"").toLowerCase();if(!s.letters.includes(typed))return;const t=s.targets.find(x=>x.letter===typed);if(!t){ninjaMessage("TRY AGAIN!");setTimeout(()=>ninjaMessage("TYPE THE LETTER!"),450);return}const i=s.targets.indexOf(t);s.targets.splice(i,1);ninjaParticles(t.x,t.y,t.bomb);if(t.bomb)ninjaEndGame("BOOM!");else{s.score++;ninjaMessage("GREAT!");ninjaUpdateHUD();setTimeout(()=>ninjaMessage("TYPE THE LETTER!"),350)}e.preventDefault()}
function ninjaLoop(now){const s=ninjaState;if(!s)return;const ctx=s.ctx;ctx.clearRect(0,0,s.w,s.h);if(!s.gameOver){if(now-s.lastSpawn>650&&s.targets.length<3){ninjaSpawn();s.lastSpawn=now}for(const t of s.targets){t.y-=t.vy;t.angle+=.015}for(let i=s.targets.length-1;i>=0;i--){const t=s.targets[i];if(t.y<-130){s.targets.splice(i,1);if(!t.bomb){s.lives--;ninjaUpdateHUD();ninjaMessage("MISSED!");if(s.lives<=0)ninjaEndGame("GAME OVER")}else ninjaMessage("GOOD AVOID!")}}}for(const p of s.particles){p.x+=p.dx;p.y+=p.dy;p.dy+=.25;p.life--;ctx.globalAlpha=Math.max(0,p.life/18);ctx.fillStyle=p.bomb?"#333":"#ff3333";ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill()}s.particles=s.particles.filter(p=>p.life>0);ctx.globalAlpha=1;for(const t of s.targets){const im=s.images[t.key],size=t.key==="bomb"?160:150;if(im&&im.complete){ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.angle);ctx.drawImage(im,-size/2,-size/2,size,size);ctx.restore()}ctx.fillStyle="white";ctx.strokeStyle="black";ctx.lineWidth=4;ctx.fillRect(t.x-60,t.y+70,120,120);ctx.strokeRect(t.x-60,t.y+70,120,120);ctx.fillStyle="black";ctx.font="700 92px 'Trebuchet MS',Verdana,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(t.letter.toLowerCase(),t.x,t.y+130)}if(s.gameOver){ctx.fillStyle="rgba(0,0,0,.72)";ctx.fillRect(0,0,s.w,s.h);ctx.fillStyle="red";ctx.font="bold 68px Arial";ctx.textAlign="center";ctx.fillText("GAME OVER",s.w/2,s.h/2-50);ctx.fillStyle="white";ctx.font="bold 38px Verdana";ctx.fillText("FINAL SCORE: "+s.score,s.w/2,s.h/2+20)}ninjaRaf=requestAnimationFrame(ninjaLoop)}
function endNinjaReview(){if(ninjaState){window.onkeydown=null;window.removeEventListener("resize",ninjaState.resize)}cancelAnimationFrame(ninjaRaf);ninjaRaf=0;ninjaState=null;showLessonMenu()}
function nextFromNinja(){const g=ninjaState&&ninjaState.groupEnd||3;const q={3:1,6:2,9:3,12:4,15:5}[g]||1;const nextLesson=g+1;endNinjaReview();sessionStorage.setItem("typingUnitReturn","1");sessionStorage.setItem("typingUnitStudent",studentName);sessionStorage.setItem("typingUnitNextLesson",String(nextLesson));window.location.href="Keyboard_Quest.html?level="+q+"&return=Typing_Unit.html";}
function reviewNotice(n){startNinjaReview(n)}
function showLevelMenu(n){
 lessonNumber=n;let l=LESSONS[n],levels=LEVEL_NAMES.map((x,i)=>button(`LEVEL ${i+1}<br>${x}<br><br>${levelStats(n,i+1)}`,`startLesson(${n},${i+1})`)).join("");
 screen(`<div class="center"><h2>Lesson ${n}: ${esc(l.title)}</h2><div class="subtitle">New keys / skill: ${esc(l.skill)}</div><div class="grid level-grid">${levels}</div><div class="bottom">${button("BACK TO LESSONS","showLessonMenu()")}</div></div>`)
}
function showGamesMenu(groupEnd){
 const gameLevel={3:1,6:2,9:3,12:4,15:5}[groupEnd]||1;
 screen(`<div class="center"><h2>Games</h2><div class="subtitle">Lessons ${groupEnd-2}-${groupEnd}</div><div class="grid level-grid">${button("🍓 FRUIT NINJA<br>LEVEL "+gameLevel,`startNinjaReview(${groupEnd})`)}${button("⌨️ KEYBOARD QUEST<br>LEVEL "+gameLevel,`startKeyboardQuest(${gameLevel})`)}${button("🧟 ZOMBIE DEFENDER<br>LEVEL "+gameLevel,`startTypingDefender(${gameLevel},${groupEnd})`)}</div><div class="bottom">${button("BACK TO LESSONS","showLessonMenu()")}</div></div>`)
}
function startLesson(n,lvl){
 lessonNumber=n;levelNumber=lvl;prompt=LESSONS[n].levels[lvl-1];currentPosition=0;correctCount=0;errorCount=0;correctedErrorCount=0;
 timerStarted=false;startTime=0;submitted=false;characterStatus=Array.from(prompt,()=> "untyped");typedText="";showTypingScreen()
}
function showTypingScreen(){
 let chars="",start=0;while(start<prompt.length){let end=Math.min(start+75,prompt.length);if(end<prompt.length){let space=prompt.lastIndexOf(" ",end-1);if(space>=start)end=space+1}if(end<=start)end=Math.min(start+75,prompt.length);let row=prompt.slice(start,end).split("").map((c,j)=>{let i=start+j;return `<span id="c${i}" class="char">${c===" "?"\u00a0":esc(c)}</span>`}).join("");chars+=`<div class="prompt-row">${row}</div>`;start=end;}
 screen(`<div class="typing-wrap"><h2>Lesson ${lessonNumber} • Level ${levelNumber}: ${LEVEL_NAMES[levelNumber-1]}</h2><div style="font-size:20px;margin-bottom:8px">${esc(studentName)}</div>
 <div id="prompt" class="prompt">${chars}</div>
 <textarea id="typingArea" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><div id="timer" class="timer">Time: 0.0 seconds</div>
 <div class="bottom">${button("SUBMIT","submitTest()")}${button("BACK TO LESSON","showLevelMenu(lessonNumber)")}</div></div>`);
 updatePromptColors();let a=document.getElementById("typingArea");a.addEventListener("keydown",handleKey);a.focus();updateTimer()
}
function startTimer(){if(!timerStarted){timerStarted=true;startTime=performance.now()}}
function updateTimer(){let e=document.getElementById("timer");if(!e)return;e.textContent=`Time: ${timerStarted?((performance.now()-startTime)/1000).toFixed(1):"0.0"} seconds`;timerId=requestAnimationFrame(updateTimer)}
function renderTypingArea(){let a=document.getElementById("typingArea");if(!a)return;let rows=[];for(let i=0;i<typedText.length;i+=75)rows.push(typedText.slice(i,i+75));a.value=rows.join("\n")}
function updatePromptColors(){characterStatus.forEach((s,i)=>{let e=document.getElementById("c"+i);if(!e)return;e.className="char";if(i===currentPosition)e.classList.add("current");else if(s==="correct")e.classList.add("correct");else if(s==="error")e.classList.add("error");else if(s==="corrected")e.classList.add("corrected")})}
function handleKey(e){
 if(["Shift","Control","Alt","Meta","CapsLock"].includes(e.key)||(/^F\d+$/.test(e.key)&&e.key.startsWith("F"))){e.preventDefault();return}
 if(e.key==="Backspace"){e.preventDefault();handleBackspace();return}if(e.key==="Enter"){e.preventDefault();submitTest();return}
 if(submitted||currentPosition>=prompt.length||e.key.length!==1){e.preventDefault();return}
 startTimer();let expected=prompt[currentPosition],idx=currentPosition;
 if(e.key===expected){if(characterStatus[idx]==="error"||characterStatus[idx]==="retry"){characterStatus[idx]="corrected";correctedErrorCount++}else characterStatus[idx]="correct";correctCount++;currentPosition++;typedText+=e.key;renderTypingArea()}
 else{errorCount++;characterStatus[idx]="error";currentPosition++;typedText+=e.key;renderTypingArea()}
 updatePromptColors();e.preventDefault()
}
function handleBackspace(){
 if(currentPosition<=0||submitted)return;let idx=currentPosition-1,s=characterStatus[idx];
 if(typedText.length)typedText=typedText.slice(0,-1);currentPosition--;renderTypingArea();
 if(s==="error"||s==="retry")characterStatus[idx]="retry";
 else if(s==="correct"||s==="corrected"){if(correctCount>0)correctCount--;if(s==="corrected"&&correctedErrorCount>0)correctedErrorCount--;characterStatus[idx]="untyped"}
 updatePromptColors()
}
function submitTest(){
 if(submitted)return;submitted=true;let elapsed=timerStarted?(performance.now()-startTime)/1000:0;stopTimer();
 let wpm=elapsed>0?(correctCount/5)/(elapsed/60):0,attempts=correctCount+errorCount,accuracy=attempts>0?correctCount/attempts*100:0;
 saveData(elapsed,wpm,accuracy);showResults(elapsed,wpm,accuracy)
}
async function saveSharedResult(row){
 try{await supabaseRequest("typing_results",{method:"POST",body:JSON.stringify({date:row.Date,time:row.Time,student:row.Student,lesson:row.Lesson,level:row.Level,level_name:row["Level Name"],prompt:row.Prompt,time_seconds:row["Time Seconds"],wpm:row.WPM,accuracy:row.Accuracy,correct_characters:row["Correct Characters"],errors:row.Errors,corrected_characters:row["Corrected Characters"]})});remoteReady=true}
 catch(e){console.warn("Could not save result to shared storage; local backup retained.",e)}
}
function saveData(elapsed,wpm,accuracy){
 let now=new Date(),row={
   Date:now.toLocaleDateString("en-US"),Time:now.toLocaleTimeString("en-US"),Student:studentName,Lesson:lessonNumber,Level:levelNumber,
   "Level Name":LEVEL_NAMES[levelNumber-1],Prompt:prompt,"Time Seconds":Number(elapsed.toFixed(1)),WPM:Number(wpm.toFixed(1)),
   Accuracy:Number(accuracy.toFixed(1)),"Correct Characters":correctCount,Errors:errorCount,"Corrected Characters":correctedErrorCount
 };
 data.push(row);saveJSON(DATA_KEY,data);saveSharedResult(row)
}
function showResults(elapsed,wpm,accuracy){
 window.onkeydown=null;
 screen(`<div class="center"><h1>Typing Results</h1><div class="results">Student: ${esc(studentName)}\n\nLesson ${lessonNumber}: ${esc(LESSONS[lessonNumber].title)}\nLevel ${levelNumber}: ${LEVEL_NAMES[levelNumber-1]}\n\nTime: ${elapsed.toFixed(1)} seconds\n\nTyping Speed: ${wpm.toFixed(1)} WPM\n\nAccuracy: ${accuracy.toFixed(1)}%</div>
 <div class="bottom">${button("TRY AGAIN",`startLesson(${lessonNumber},${levelNumber})`)}${button("OTHER LEVELS",`showLevelMenu(${lessonNumber})`)}${button("ALL LESSONS","showLessonMenu()")}${button([3,6,9,12,15].includes(lessonNumber)&&levelNumber===3?"🍓 NEXT LESSON • TYPING NINJA":"NEXT","nextFromResults()")}</div></div>`);
 window.onkeydown=function(e){if(e.target&&["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName))return;if(e.code==="Space"){e.preventDefault();nextFromResults()}}
}
function nextFromResults(){
 if(levelNumber<3)return startLesson(lessonNumber,levelNumber+1);
 if([3,6,9,12,15].includes(lessonNumber))return startNinjaReview(lessonNumber);
 if(lessonNumber<15)return startLesson(lessonNumber+1,1);
 showLessonMenu()
}
function csvCell(v){return `"${String(v??"").replace(/"/g,'""')}"`}
function downloadData(){
 let h=["Date","Time","Student","Lesson","Level","Level Name","Prompt","Time Seconds","WPM","Accuracy","Correct Characters","Errors","Corrected Characters"];
 let lines=[h.map(csvCell).join(",")].concat(data.map(r=>h.map(k=>csvCell(r[k])).join(",")));
 let blob=new Blob([lines.join("\r\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="typing_data.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}
async function viewData(refresh=true){
 stopTimer();
 if(refresh)try{const dr=await supabaseRequest("typing_results?select=*&order=id.desc");data=dr.map(x=>({Date:x.date,Time:x.time,Student:x.student,Lesson:x.lesson,Level:x.level,"Level Name":x.level_name,Prompt:x.prompt,"Time Seconds":x.time_seconds,WPM:x.wpm,Accuracy:x.accuracy,"Correct Characters":x.correct_characters,Errors:x.errors,"Corrected Characters":x.corrected_characters}));saveJSON(DATA_KEY,data)}catch(e){}
 let h=["Date","Time","Student","Lesson","Level","Level Name","Prompt","Time Seconds","WPM","Accuracy","Correct Characters","Errors","Corrected Characters"];
 let rows=data.length?data.map(r=>`<tr>${h.map(k=>`<td>${esc(r[k]??"")}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${h.length}">No typing data saved yet.</td></tr>`;
 screen(`<div style="height:100%;min-height:0;display:flex;flex-direction:column"><h2 style="flex:0 0 auto">Typing Data</h2><div class="bottom" style="justify-content:flex-start;flex:0 0 auto;margin:8px 0">${button("DOWNLOAD CSV","downloadData()")}${button("BACK","showStudentMenu()")}${button("CLEAR ALL DATA","clearAllData()")}</div><div class="data-wrap" style="min-height:0;min-width:0;flex:1;overflow:auto"><table style="width:max-content;min-width:100%"><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div></div>`)
}
async function clearAllData(){
 const password=window.prompt("Enter the teacher password to clear ALL typing data:");
 if(password===null)return;
 if(password!=="MUSDvision"){alert("Incorrect password. No data was deleted.");return}
 if(!confirm("Delete ALL saved typing data for ALL students? This cannot be undone."))return;
 try{
   await supabaseRequest("typing_results?id=not.is.null",{method:"DELETE",headers:{Prefer:"return=minimal"}});
   data=[];saveJSON(DATA_KEY,data);
   alert("All typing data has been cleared.");
   viewData(false);
 }catch(e){console.error(e);alert("The shared typing data could not be cleared. Please add the Supabase DELETE policy.");}
}
document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;const app=document.getElementById("app");if(!app)return;const back=[...app.querySelectorAll("button")].find(b=>b.textContent.trim().toUpperCase()==="BACK TO LESSONS");if(back){e.preventDefault();back.click();}});
function bootTypingUnit(){const returning=sessionStorage.getItem("typingUnitReturn")==="1";const savedStudent=sessionStorage.getItem("typingUnitStudent")||"";const params=new URLSearchParams(location.search);const nextLesson=Number(params.get("lesson")||0);const nextLevel=Number(params.get("level")||1);if(returning&&savedStudent){studentName=savedStudent;sessionStorage.removeItem("typingUnitReturn");sessionStorage.removeItem("typingUnitStudent");if(nextLesson>=1&&nextLesson<=15&&nextLevel>=1&&nextLevel<=3){sessionStorage.removeItem("typingUnitNextLesson");startLesson(nextLesson,nextLevel)}else{sessionStorage.removeItem("typingUnitNextLesson");showLessonMenu()}}else showStudentMenu();}loadSharedData().finally(bootTypingUnit);
</script></body></html>
