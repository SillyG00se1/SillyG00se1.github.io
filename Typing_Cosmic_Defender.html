<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmic Typing Defender</title>
<style>
:root{color-scheme:dark;--cyan:#65f5ff;--pink:#ff71d4;--gold:#ffe66d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b24;color:#fff;font-family:Trebuchet MS,Arial,sans-serif}
body{display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:linear-gradient(90deg,#141a4b,#32134b);border-bottom:2px solid #5de9ff;flex-wrap:wrap}
h1{font-size:clamp(22px,3vw,34px);margin:0;color:#a5fbff;text-shadow:0 0 12px #24c9ff}.hud{display:flex;gap:18px;align-items:center;font-size:clamp(16px,2vw,22px);font-weight:bold;flex-wrap:wrap}.hud span strong{color:var(--gold)}
#arena{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#302064 0%,#11163c 42%,#070b24 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%}.bottom{position:relative;z-index:2;display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;background:#090d29;border-top:2px solid #343f88;flex-wrap:wrap}
button{font:700 20px Trebuchet MS,Arial,sans-serif;color:white;background:linear-gradient(#364ba2,#20265e);border:2px solid #829bff;border-radius:12px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 0 #0b1037}
button:hover,button:focus{outline:3px solid #fff;background:linear-gradient(#4c6be0,#303d8a)}button:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1037}
#typing{width:min(620px,95vw);font:700 clamp(30px,3vw,38px) Trebuchet MS,Arial,sans-serif;text-align:center;background:#fff;color:#121538;border:4px solid var(--cyan);border-radius:12px;padding:9px 12px;outline:none}
#typing:focus{box-shadow:0 0 16px #65f5ff}.hint{font-size:16px;color:#dce6ff;text-align:center;max-width:340px}
.overlay{position:absolute;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,7,29,.83);padding:18px;text-align:center}
.panel{max-width:850px;width:100%;max-height:100%;overflow:auto;background:linear-gradient(145deg,#1a2460,#35164f);border:3px solid #65f5ff;border-radius:24px;padding:clamp(18px,3vw,34px);box-shadow:0 0 36px #2edfff66}
.panel h2{font-size:clamp(30px,5vw,52px);margin:0 0 12px;color:#a5fbff;text-shadow:0 0 12px #24c9ff}.panel p{font-size:clamp(17px,2.2vw,23px);line-height:1.4}.levelgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.levelgrid button{min-height:94px;font-size:clamp(16px,2vw,22px)}.levelgrid small{display:block;font-size:14px;color:#d9e7ff;margin-top:6px}
#feedback{position:absolute;top:15px;left:12%;right:12%;z-index:2;text-align:center;font-weight:bold;font-size:clamp(26px,3.5vw,42px);color:#fff;text-shadow:0 0 12px #65f5ff;pointer-events:none}
@media(max-width:650px){.levelgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{justify-content:center}.hud{justify-content:center}.hint{display:none}}
</style>
</head>
<body>
<header class="top"><h1>🚀 COSMIC TYPING DEFENDER</h1><div class="hud"><span>LEVEL <strong id="level">1</strong></span><span>SHIELDS <strong id="lives">3</strong></span><span>ENERGY <strong id="score">0</strong></span><span>STREAK <strong id="streak">0</strong></span></div></header>
<main id="arena"><canvas id="space"></canvas><div id="feedback">Ready, space cadet?</div><div class="overlay" id="overlay"><div class="panel"><h2>Cosmic Typing Defender</h2><div class="levelgrid" id="levelgrid"></div><button id="start">START MISSION 🚀</button></div></div></main>
<footer class="bottom"><input id="typing" aria-label="Type the glowing target" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder=""><button id="fire">BLAST! ✨</button><button id="pause">PAUSE</button><button id="home">MISSIONS</button></footer>
<script>
const missions=[
 {name:"Home Row Cadet",range:"Lessons 1–3",desc:"Home row + G, H, E, I",words:["sad","dad","ask","fall","glad","fish","hide","side","jig","his","she","dash","half","flag","like","dish","jill","hill","ideal","all"]},
 {name:"Orbit Explorer",range:"Lessons 4–6",desc:"Add R, U, T, Y, W, O",words:["star","your","write","story","tower","water","trust","today","yellow","worry","route","outer","start","ready","toward","worth","study","truly","world","writer"]},
 {name:"Nebula Navigator",range:"Lessons 7–9",desc:"Add Q, P, C, M, V, B",words:["space","brave","blue","comet","planet","purple","vivid","move","peace","quick","become","picture","vacuum","public","bright","camp","music","probe","clever","bounce"]},
 {name:"Galaxy Guardian",range:"Lessons 10–12",desc:"Add N, X, Z + punctuation",words:["next","zone","amazing","expand","explore","mission","connect","exciting","zenith","mix","oxygen","cosmic","signal","launch","maximum","science","excellent","zoom","class;","go,now"]},
 {name:"Cosmic Champion",range:"Lessons 13–15",desc:"Punctuation review + capitals",words:["Cosmic.","Launch!","Explore.","Galaxy?","Practice.","Ready?","Stars.","Improve.","Mission!","Fast.","Vast.","Reach!","Aim.","Star.","Worlds."]},
 {name:"BONUS: Number Nebula",range:"Bonus mission",desc:"Numbers 0–9",words:["123","456","789","2026","314","808","42","100","2468","13579","909","555","20260","9876","10101"]}
];
const canvas=document.getElementById("space"),ctx=canvas.getContext("2d"),arena=document.getElementById("arena");
const input=document.getElementById("typing"),overlay=document.getElementById("overlay");
let W=0,H=0,stars=[],targets=[],particles=[],mission=0,score=0,lives=3,streak=0,spawnTimer=0,lastTime=0,running=false,paused=false,gameOver=false,completed=[],feedbackTimer=0;
const themes=[
 {bg1:"#080d2d",bg2:"#201449",planet1:["#ff75cf","#6136a8"],planet2:["#62e9ff","#2c398a"],asteroids:[190,285,325]},
 {bg1:"#041c35",bg2:"#07506b",planet1:["#7fffe0","#087b83"],planet2:["#8cc7ff","#2451a3"],asteroids:[165,190,210]},
 {bg1:"#180b36",bg2:"#54205e",planet1:["#ffad70","#a8326d"],planet2:["#d4a0ff","#6332a8"],asteroids:[275,305,330]},
 {bg1:"#061d20",bg2:"#164c39",planet1:["#d5ff75","#488c32"],planet2:["#69fff0","#167c86"],asteroids:[75,125,165]},
 {bg1:"#260b28",bg2:"#702342",planet1:["#ffe36b","#c34b54"],planet2:["#ff9be6","#9e3bc2"],asteroids:[0,325,45]},
 {bg1:"#06132d",bg2:"#263f70",planet1:["#e0f7ff","#5077b9"],planet2:["#ffd36b","#bd6c37"],asteroids:[195,215,45]}
];
function playTheme(){return themes[mission]||themes[0]}
function resize(){const r=arena.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);stars=Array.from({length:Math.max(70,Math.floor(W*H/8500))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.3,a:Math.random()*.7+.2,v:Math.random()*22+8}));}
window.addEventListener("resize",resize);resize();
function drawBackground(dt){ctx.clearRect(0,0,W,H);const theme=playTheme();const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,theme.bg1);g.addColorStop(1,theme.bg2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(const s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}ctx.globalAlpha=s.a;ctx.fillStyle="#d8f8ff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 // distant glowing planets
 const t=performance.now()/1000;planet(W*.82,H*.2,Math.min(64,W*.065),theme.planet1[0],theme.planet1[1],t);planet(W*.18,H*.68,Math.min(43,W*.045),theme.planet2[0],theme.planet2[1],-t);
 // central safe play lane: targets stay away from both outer edges
ctx.save();ctx.fillStyle="rgba(100,235,255,.035)";ctx.fillRect(W*.17,0,W*.66,H);ctx.strokeStyle="rgba(150,235,255,.13)";ctx.setLineDash([10,12]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.17,0);ctx.lineTo(W*.17,H);ctx.moveTo(W*.83,0);ctx.lineTo(W*.83,H);ctx.stroke();ctx.restore();
 // starship
 const x=W*.5,y=H-54;ctx.save();ctx.translate(x,y);ctx.shadowBlur=20;ctx.shadowColor="#64f6ff";ctx.fillStyle="#c8fbff";ctx.beginPath();ctx.moveTo(0,-35);ctx.lineTo(30,20);ctx.lineTo(9,14);ctx.lineTo(0,25);ctx.lineTo(-9,14);ctx.lineTo(-30,20);ctx.closePath();ctx.fill();ctx.fillStyle="#ff71d4";ctx.beginPath();ctx.moveTo(-9,17);ctx.lineTo(0,35+Math.random()*7);ctx.lineTo(9,17);ctx.fill();ctx.restore();}
function planet(x,y,r,c1,c2,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot*.1);let g=ctx.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.shadowBlur=18;ctx.shadowColor=c1;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=c1;ctx.globalAlpha=.55;ctx.lineWidth=Math.max(3,r*.12);ctx.beginPath();ctx.ellipse(0,0,r*1.55,r*.38,rot*.15,0,Math.PI*2);ctx.stroke();ctx.restore();ctx.globalAlpha=1;}
function randWord(){const arr=missions[mission].words;return arr[Math.floor(Math.random()*arr.length)]}
function spawn(){if(targets.length>=4)return;const word=randWord(),r=Math.max(58,Math.min(84,48+word.length*2.4));const laneLeft=W*.17+r,laneRight=W*.83-r;const x=laneRight>laneLeft?laneLeft+Math.random()*(laneRight-laneLeft):W*.5;const theme=playTheme();const hue=theme.asteroids[Math.floor(Math.random()*theme.asteroids.length)]+(Math.random()*16-8);targets.push({word,x,y:-r-10,r,vy:24+mission*5+Math.random()*13,phase:Math.random()*6.2,hue,hit:0});}
function drawTarget(t,dt){t.y+=t.vy*dt;t.phase+=dt*1.5;const bob=Math.sin(t.phase)*3;ctx.save();ctx.translate(t.x,t.y+bob);ctx.rotate(Math.sin(t.phase*.6)*.04);ctx.shadowBlur=20;ctx.shadowColor="hsl("+t.hue+",100%,65%)";let gr=ctx.createRadialGradient(-t.r*.3,-t.r*.4,2,0,0,t.r);gr.addColorStop(0,"hsl("+t.hue+",95%,82%)");gr.addColorStop(.45,"hsl("+t.hue+",78%,47%)");gr.addColorStop(1,"#171b4e");ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,t.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle="#eafcff";ctx.lineWidth=3;ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(0,0,t.r-4,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
 // crater details
 ctx.fillStyle="#fff";ctx.globalAlpha=.25;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(Math.cos(i*2.1+t.phase)*t.r*.5,Math.sin(i*2.1+t.phase)*t.r*.5,t.r*.11,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 const fs=Math.min(38,Math.max(23,Math.floor((t.r*1.65)/Math.max(t.word.length*.55,2))));ctx.font="bold "+fs+"px Trebuchet MS,Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineWidth=4;ctx.strokeStyle="#101338";ctx.strokeText(t.word,0,1);ctx.fillStyle="#fff";ctx.fillText(t.word,0,1);ctx.restore();}
function burst(x,y,hue){for(let i=0;i<24;i++){const a=Math.random()*Math.PI*2,v=50+Math.random()*180;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.65+Math.random()*.55,max:.9,hue})}}
function updateHud(){document.getElementById("level").textContent=mission+1;document.getElementById("lives").textContent="♥ ".repeat(lives).trim()||"0";document.getElementById("score").textContent=score;document.getElementById("streak").textContent=streak}
function sayFeedback(s){const f=document.getElementById("feedback");f.textContent=s;f.style.color="#fff";clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>{if(running&&!paused)f.textContent=""},1200)}
function fire(){if(!running||paused||gameOver)return;const val=input.value.trim().toLowerCase();if(!val)return;const i=targets.findIndex(t=>t.word.toLowerCase()===val);if(i<0){streak=0;sayFeedback("Keep trying — find that target!");input.select();updateHud();return}const t=targets.splice(i,1)[0];burst(t.x,t.y,t.hue);score+=10+Math.min(streak,10)*2;streak++;sayFeedback(["NICE SHOT! ✨","COSMIC HIT! 🌟","SUPER TYPING! 🚀","STARDUST! 💫"][Math.floor(Math.random()*4)]);input.value="";updateHud();if(score>= (mission+1)*100){missionComplete()}}
function missionComplete(){if(completed.includes(mission))return;completed.push(mission);running=false;input.blur();const isLast=mission===missions.length-1;overlay.innerHTML='<div class="panel"><h2>MISSION CLEARED! 🌠</h2><p>You protected the galaxy with your typing skills.</p><p><strong>Energy collected: '+score+'</strong></p><button id="continue">'+(isLast?"PLAY AGAIN 🚀":"NEXT MISSION ➜")+'</button><button id="missionMenu">MISSION SELECT</button></div>';overlay.style.display="flex";document.getElementById("continue").onclick=()=>{if(isLast){completed=[];mission=0;score=0} else mission++;startMission()};document.getElementById("missionMenu").onclick=showMenu}
function loseLife(){lives--;streak=0;updateHud();sayFeedback("SHIELD HIT! WATCH THE ASTEROIDS!");if(lives<=0){running=false;gameOver=true;overlay.innerHTML='<div class="panel"><h2>SHIP NEEDS REPAIRS! 🛠️</h2><p>You collected <strong>'+score+'</strong> energy points.</p><p></p><button id="retry">RETRY MISSION</button><button id="missionMenu">MISSION SELECT</button></div>';overlay.style.display="flex";document.getElementById("retry").onclick=()=>startMission();document.getElementById("missionMenu").onclick=showMenu}}
function loop(now){const dt=Math.min((now-lastTime)/1000||0,.04);lastTime=now;drawBackground(dt);if(running&&!paused&&!gameOver){spawnTimer+=dt;if(spawnTimer>(Math.max(.95,2.2-mission*.17))){spawn();spawnTimer=0}for(let i=targets.length-1;i>=0;i--){const t=targets[i];drawTarget(t,dt);if(t.y>H-88){targets.splice(i,1);loseLife();if(!running)break}}}else targets.forEach(t=>drawTarget(t,0));for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=85*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle="hsl("+p.hue+",100%,68%)";ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1;requestAnimationFrame(loop)}
function showMenu(){running=false;paused=false;gameOver=false;overlay.innerHTML='<div class="panel"><h2>Choose Your Mission</h2><p>Each mission has its own planet colors and asteroid glow. Targets stay in the central play lane, away from the far edges.</p><div class="levelgrid" id="levelgrid"></div><button id="start">START MISSION 🚀</button></div>';overlay.style.display="flex";const grid=document.getElementById("levelgrid");missions.forEach((m,i)=>{const b=document.createElement("button");b.innerHTML=(i+1===6?"🔢 ":"🌌 ")+ "LEVEL "+(i+1)+"<small>"+m.name+"<br>"+m.range+"</small>";b.onclick=()=>{mission=i;startMission()};grid.appendChild(b)});document.getElementById("start").onclick=()=>startMission()}
function startMission(){score=0;lives=3;streak=0;targets=[];particles=[];spawnTimer=0;gameOver=false;paused=false;running=true;updateHud();overlay.style.display="none";input.value="";input.disabled=false;input.placeholder="";document.getElementById("pause").textContent="PAUSE";sayFeedback("MISSION "+(mission+1)+": "+missions[mission].name.toUpperCase());input.focus()}
document.getElementById("start").onclick=()=>startMission();document.getElementById("fire").onclick=fire;document.getElementById("typing").addEventListener("keydown",e=>{if(e.key==="Enter"||e.code==="Space"){e.preventDefault();fire()}});document.getElementById("pause").onclick=()=>{if(!running)return;paused=!paused;document.getElementById("pause").textContent=paused?"RESUME":"PAUSE";sayFeedback(paused?"MISSION PAUSED":"MISSION RESUMED");if(!paused)input.focus()};document.getElementById("home").onclick=showMenu;
missions.forEach((m,i)=>{const b=document.createElement("button");b.innerHTML=(i===5?"🔢 ":"🌌 ")+"LEVEL "+(i+1)+"<small>"+m.name+"<br>"+m.range+"</small>";b.onclick=()=>{mission=i;startMission()};document.getElementById("levelgrid").appendChild(b)});
updateHud();requestAnimationFrame(loop);
</script></body></html>
