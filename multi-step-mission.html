<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi-Step Mission</title>
<style>
:root{color-scheme:dark;--bg:#101522;--panel:#1b2435;--panel2:#26324a;--ink:#f8f9ff;--muted:#c3cbe0;--gold:#ffe27a;--green:#69efb4;--blue:#8adfff;--red:#ffb1b1}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#263552 0%,var(--bg) 60%);color:var(--ink);font:18px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
main{max-width:1120px;margin:auto;padding:16px}
h1{font-size:clamp(2rem,5vw,3.5rem);text-align:center;line-height:1.08;margin:8px 0;color:var(--gold)}
h2{font-size:1.35rem;margin:0 0 12px}
p{color:var(--muted);margin:8px 0}
.panel{background:var(--panel);border:2px solid #3a4965;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 10px 28px #0002}
.topline{text-align:center;font-size:1.05rem}
.badge{display:inline-block;border:1px solid #637492;background:#121a29;border-radius:999px;padding:5px 12px;margin:4px;color:var(--muted)}
button,select,input{font:inherit}
button{padding:12px 16px;border-radius:13px;border:2px solid #667895;background:var(--panel2);color:var(--ink);font-weight:800;cursor:pointer;min-height:48px}
button:hover{filter:brightness(1.12)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.primary{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.goodBtn{background:#18533e;border-color:#57dca7}
.controls{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;max-width:480px;margin:auto}
label{display:block;font-weight:750;margin-bottom:6px}
select{width:100%;min-height:48px;padding:10px;border-radius:10px;background:#111827;color:white;border:2px solid #53617b}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
#instruction{font-size:clamp(1.45rem,3.6vw,2.4rem);font-weight:900;text-align:center;color:var(--gold);min-height:2.2em;display:flex;align-items:center;justify-content:center}
#instruction.memory-hidden{visibility:hidden}
.stepDot.memory-hidden .stepEmoji{visibility:hidden}
.stepDot.memory-hidden .stepLabel{visibility:hidden}
.stepDot.revealed .stepEmoji,#progressSteps .stepDot.done .stepEmoji{visibility:visible}
.stepDot.revealed .stepLabel,#progressSteps .stepDot.done .stepLabel{visibility:visible}
#progressSteps{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.stepDot{display:flex;align-items:center;justify-content:center;gap:10px;min-width:120px;min-height:100px;padding:10px 16px;border-radius:16px;background:#121a29;border:3px solid #52617c;color:var(--muted);font-weight:900;font-size:1.25rem}
.stepDot .stepEmoji{font-size:clamp(2.5rem,6vw,4rem);line-height:1}
.stepDot.done{background:#164632;border-color:var(--green);color:white}
.stepDot.current{border-color:var(--gold);color:var(--gold)}
.stepDot .check{font-size:1.5rem;color:var(--green)}
#board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.choice{min-height:205px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px;background:#131c2b;border:3px solid #445571;border-radius:18px;padding:14px;transition:transform .12s,border-color .12s,background .12s}
.choice .emoji{font-size:clamp(3.8rem,9vw,6.5rem);line-height:1.1}
.choice .name{font-size:1.15rem;font-weight:800;color:#e9efff}
.choice:disabled{opacity:.72;cursor:default}
.choice.correct{background:#174b38;border-color:var(--green)}
.choice.wrong{animation:nudge .2s linear 2;border-color:var(--red)}
#feedback{font-size:1.2rem;font-weight:850;text-align:center;min-height:2.1em;padding:8px;color:var(--blue)}
#feedback.success{color:var(--green)}#feedback.try{color:var(--gold)}
.statrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
footer{text-align:center;color:var(--muted);font-size:.9rem;padding:10px}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media(max-width:680px){main{padding:9px}.panel{padding:13px}#board{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{min-height:165px}.choice .emoji{font-size:clamp(3.5rem,15vw,5.5rem)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<h1>🗺️ Multi-Step Mission</h1>


<section class="panel">
 <div class="controls">
  <div><label for="difficulty">Level</label><select id="difficulty">
   <option value="0">Level 1 · One step</option>
   <option value="1">Level 2 · Two steps</option>
   <option value="2">Level 3 · Two steps + more choices</option>
   <option value="3">Level 4 · Memory: two steps</option>
   <option value="4">Level 5 · Three steps</option>
   <option value="5">Level 6 · Three steps + order words</option>
   <option value="6">Level 7 · Memory: three steps</option>
   <option value="7">Level 8 · Four steps</option>
   <option value="8">Level 9 · Memory: four steps</option>
   <option value="9">Level 10 · Five steps</option>
   <option value="10">Level 11 · Memory: five steps</option>
   <option value="11">Level 12 · Six steps</option>
  </select></div>

 </div>
 <div class="actions">
  <button id="newMission" class="primary" type="button">New mission</button>
  <button id="reset" type="button">Reset session</button>
 </div>
</section>

<section class="panel">
 <div class="statrow">
  <span class="badge" id="levelBadge">Level 1</span>
  <span class="badge" id="missionCount">Missions completed: 0</span>
  <span class="badge" id="starCount">⭐ Stars: 0</span>
  <span class="badge" id="accuracy">Recent success: —</span>
 </div>
 <h2 style="text-align:center;margin-top:16px">Your mission</h2>
 <div id="instruction" aria-live="polite">Press New mission to begin!</div>
 <div id="progressSteps" aria-label="Instruction step progress"></div>
 <div id="feedback" role="status" aria-live="polite"></div>
 <div id="board" aria-label="Picture choices"></div>
</section>

<section class="panel">
 <div class="actions" style="justify-content:center">
  <button id="prevLevel" type="button">← Easier level</button>
  <button id="nextLevel" type="button">Next difficulty →</button>
 </div>
</section>

</main>
<script>
(function(){
'use strict';
const ITEMS=[
 {id:'star',name:'star',emoji:'⭐'},{id:'apple',name:'apple',emoji:'🍎'},{id:'ball',name:'ball',emoji:'⚽'},
 {id:'cat',name:'cat',emoji:'🐱'},{id:'book',name:'book',emoji:'📘'},{id:'flower',name:'flower',emoji:'🌼'},
 {id:'car',name:'car',emoji:'🚗'},{id:'fish',name:'fish',emoji:'🐠'},{id:'moon',name:'moon',emoji:'🌙'},
 {id:'pizza',name:'pizza',emoji:'🍕'},{id:'duck',name:'duck',emoji:'🦆'},{id:'heart',name:'heart',emoji:'❤️'},
 {id:'tree',name:'tree',emoji:'🌳'},{id:'gift',name:'gift',emoji:'🎁'},{id:'sun',name:'sun',emoji:'☀️'},
 {id:'cup',name:'cup',emoji:'🥤'},{id:'shoe',name:'shoe',emoji:'👟'},{id:'frog',name:'frog',emoji:'🐸'},
 {id:'unicorn',name:'unicorn',emoji:'🦄'},{id:'button',name:'button',emoji:'🔘'},
 {id:'dragon',name:'dragon',emoji:'🐉'},{id:'cupcake',name:'cupcake',emoji:'🧁'},
 {id:'cookie',name:'cookie',emoji:'🍪'},{id:'dinosaur',name:'dinosaur',emoji:'🦖'},
 {id:'rainbow',name:'rainbow',emoji:'🌈'},{id:'teddy bear',name:'teddy bear',emoji:'🧸'},
 {id:'butterfly',name:'butterfly',emoji:'🦋'},{id:'rocket',name:'rocket',emoji:'🚀'},
 {id:'crown',name:'crown',emoji:'👑'},{id:'ice cream',name:'ice cream',emoji:'🍦'},
 {id:'train',name:'train',emoji:'🚂'},{id:'ladybug',name:'ladybug',emoji:'🐞'}
];
const $=id=>document.getElementById(id);
let level=0,sequence=[],boardItems=[],step=0,missionsCompleted=0,stars=0,attempts=[],locked=false,missionActive=false,currentMissionHadError=false,memoryTimer=null,memoryHidden=false;
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function settings(){return [
 {steps:1,choices:4,memory:false},
 {steps:2,choices:4,memory:false},
 {steps:2,choices:6,memory:false},
 {steps:2,choices:6,memory:true},
 {steps:3,choices:6,memory:false},
 {steps:3,choices:8,memory:false},
 {steps:3,choices:8,memory:true},
 {steps:4,choices:8,memory:false},
 {steps:4,choices:8,memory:true},
 {steps:5,choices:10,memory:false},
 {steps:5,choices:10,memory:true},
 {steps:6,choices:12,memory:false}
][level];}
function item(id){return ITEMS.find(x=>x.id===id);}
function orderLabel(i,total){
 if(total===1)return 'First';
 if(i===0)return 'First';
 if(i===total-1)return 'Last';
 return 'Next';
}
function makeInstruction(seq){
 if(seq.length===1)return 'Touch the '+item(seq[0]).name+'.';
 return seq.map((id,i)=>orderLabel(i,seq.length)+', touch the '+item(id).name+'.').join(' ');
}
function clearMemoryTimer(){if(memoryTimer!==null){clearTimeout(memoryTimer);memoryTimer=null;}}
function newMission(){
 clearMemoryTimer();
 locked=false;missionActive=true;step=0;currentMissionHadError=false;memoryHidden=false;
 const s=settings();sequence=shuffle(ITEMS).slice(0,s.steps).map(x=>x.id);
 const pool=shuffle(ITEMS.filter(x=>!sequence.includes(x.id))).slice(0,s.choices-s.steps);
 boardItems=shuffle([...sequence.map(id=>item(id)),...pool]);
 $('instruction').classList.remove('memory-hidden');
 $('instruction').textContent=makeInstruction(sequence);
 $('feedback').className='';$('feedback').textContent='';
 renderSteps();renderBoard();
 if(s.memory){
  $('feedback').textContent='Remember the order!';
  memoryTimer=setTimeout(()=>{
   if(!missionActive)return;
   memoryHidden=true;
   $('instruction').classList.add('memory-hidden');
   renderSteps();
   $('feedback').textContent='Your turn!';
   memoryTimer=null;
  },4000);
 }
}
function renderSteps(){
 const s=settings();
 $('progressSteps').innerHTML=sequence.map((id,i)=>{
  const done=i<step;
  const current=i===step&&missionActive;
  const label=orderLabel(i,sequence.length);
  const hidden=s.memory&&memoryHidden&&!done;
  return '<div class="stepDot '+(done?'done':current?'current':'')+(hidden?' memory-hidden':'')+(done?' revealed':'')+'"><span class="stepLabel">'+label+':</span><span class="stepEmoji" aria-hidden="true">'+item(id).emoji+'</span>'+(done?'<span class="check" aria-label="complete">✓</span>':'')+'</div>';
 }).join('');
}
function renderBoard(){
 $('board').innerHTML=boardItems.map(it=>'<button type="button" class="choice" data-id="'+it.id+'" aria-label="'+it.name+'"><span class="emoji" aria-hidden="true">'+it.emoji+'</span><span class="name">'+it.name[0].toUpperCase()+it.name.slice(1)+'</span></button>').join('');
 $('board').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.id,b)));
}
function choose(id,button){
 if(!missionActive||locked)return;
 const expected=sequence[step];
 if(id!==expected){
  currentMissionHadError=true;button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');
  $('feedback').className='try';$('feedback').textContent='Try another picture.';
  return;
 }
 $('board').querySelectorAll('.choice.wrong').forEach(b=>b.classList.remove('wrong'));
 button.classList.add('correct');button.disabled=true;step++;
 if(settings().memory&&memoryHidden){
  const completedId=sequence[step-1];
  const stepCard=$('progressSteps').children[step-1];
  if(stepCard){stepCard.classList.remove('memory-hidden');stepCard.classList.add('revealed');}
 }
 renderSteps();
 if(step>=sequence.length){
  locked=true;missionActive=false;missionsCompleted++;stars++;attempts.push(!currentMissionHadError);attempts=attempts.slice(-10);
  $('feedback').className='success';$('feedback').textContent='🎉 Mission complete!';
  updateStats();
  $('board').querySelectorAll('.choice').forEach(b=>b.disabled=true);
  $('newMission').textContent='Next mission';
 }else{
  $('feedback').className='success';$('feedback').textContent=settings().memory&&memoryHidden?'✓ Correct! Remember the next one.':'✓ Find the next picture.';
 }
}
function updateStats(){
 $('levelBadge').textContent='Level '+(level+1);
 $('missionCount').textContent='Missions completed: '+missionsCompleted;
 $('starCount').textContent='⭐ Stars: '+stars;
 const n=attempts.length,ok=attempts.filter(Boolean).length;
 $('accuracy').textContent='Recent success: '+(n?Math.round(ok/n*100)+'% ('+ok+'/'+n+')':'—');
 $('prevLevel').disabled=level===0;$('nextLevel').disabled=level===11;
}
$('difficulty').addEventListener('change',()=>{level=Number($('difficulty').value);updateStats();newMission();});
$('newMission').addEventListener('click',newMission);
$('prevLevel').addEventListener('click',()=>{if(level>0){level--; $('difficulty').value=String(level);updateStats();newMission();}});
$('nextLevel').addEventListener('click',()=>{if(level<4){level++;$('difficulty').value=String(level);updateStats();newMission();}});
$('reset').addEventListener('click',()=>{if(!confirm('Reset the mission count, stars, and recent results?'))return;missionsCompleted=0;stars=0;attempts=[];updateStats();newMission();});
updateStats();newMission();
})();
</script>
</body>
</html>
