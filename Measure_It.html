<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Measure It!</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#101018;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
*{box-sizing:border-box}#app{width:100%;height:100%}.screen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
h1{font-size:clamp(34px,4vw,54px);color:#FFE66D;margin:0 0 10px}.label{font-size:clamp(18px,2vw,25px);font-weight:bold;margin:8px}
select,button{font:700 clamp(18px,2vw,24px) Arial;color:#fff;background:#30303A;border:3px solid #666;border-radius:10px;padding:12px 18px;cursor:pointer}
select{min-width:min(430px,85vw)}button:focus,select:focus{outline:4px solid #9C4DCC}
.selected{font-size:clamp(18px,2vw,25px);font-weight:bold;color:#39D98A;margin:12px}
.help{font-size:clamp(16px,1.8vw,22px);color:#FFE66D;margin-top:18px;text-align:center}
.game{justify-content:flex-start;padding:18px 25px}.gameTitle{font-size:clamp(28px,3vw,40px);font-weight:bold}.instruction{font-size:clamp(22px,2.5vw,32px);font-weight:bold;color:#FFE66D}
#stage{width:100%;height:72%;margin-top:4px}canvas{width:100%;height:100%}.count{font-size:clamp(34px,4vw,52px);font-weight:bold}.complete{color:#39D98A;font-size:clamp(22px,2.4vw,32px);font-weight:bold}
.resultsTitle{font-size:clamp(34px,4vw,52px);font-weight:bold;color:#FFE66D}.score{font-size:clamp(48px,6vw,76px);font-weight:bold;color:#39D98A;margin:18px}.resultsText{font-size:clamp(22px,2.5vw,32px);text-align:center;line-height:1.4}
#confetti{position:fixed;inset:0;pointer-events:none}.piece{position:absolute;width:10px;height:20px;animation:fall linear infinite}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hidden{display:none!important}.homeButtons{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:14px}
</style>
</head>
<body><div id="app"></div><div id="confetti"></div>
<script>
const tools={BEANS:{plural:"beans",ratio:1},PAPERCLIPS:{plural:"paperclips",ratio:2},BUTTONS:{plural:"buttons",ratio:2},BLOCKS:{plural:"blocks",ratio:4}};
const objects=[["SMALL PUMPKIN","pumpkin",8],["MEDIUM PUMPKIN","pumpkin",12],["LARGE PUMPKIN","pumpkin",16],["SMALL HOUSE","house",8],["TALL HOUSE","house",16],["TREE","tree",12],["FLOWER","flower",8],["CACTUS","cactus",16],["LEAF","leaf",4],["ACORN","acorn",8],["U OF A LOGO","uofa",4],["SQUIRREL","squirrel",4],["SUNFLOWER","sunflower",12]];
let tool="BEANS",object=objects[0],units=0,target=0,complete=false,canvas,ctx;
function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.95;speechSynthesis.speak(u)}}
function home(){stopConfetti();canvas=null;document.getElementById("app").innerHTML=`<div class="screen"><h1>MEASURE IT!</h1><div class="label">Choose a measuring tool.</div><select id="tool">${Object.keys(tools).map(x=>`<option>${x}</option>`).join("")}</select><div class="label">Choose something to measure.</div><select id="object">${objects.map((x,i)=>`<option value="${i}">${x[0]}</option>`).join("")}</select><div class="selected" id="selected"></div><div class="homeButtons"><button id="start">START</button></div><div class="help">ENTER = START / FINISH &nbsp; • &nbsp; SPACE = ADD ONE</div></div>`;document.getElementById("tool").value=tool;document.getElementById("object").value=objects.indexOf(object);updateSelected();document.getElementById("tool").onchange=e=>{tool=e.target.value;updateSelected()};document.getElementById("object").onchange=e=>{object=objects[+e.target.value];updateSelected()};document.getElementById("start").onclick=startGame;speak(`Choose a measuring tool and something to measure. Currently ${tool} and ${object[0]}. Press Enter to start.`)}
function updateSelected(){document.getElementById("selected").textContent=`Selected: ${tool} + ${object[0]}`}
function startGame(){units=0;complete=false;target=Math.floor(object[2]/tools[tool].ratio);document.getElementById("app").innerHTML=`<div class="screen game"><div class="gameTitle">MEASURE IT!</div><div class="instruction">PRESS SPACE TO ADD ONE</div><div id="stage"><canvas id="canvas"></canvas></div><div class="count" id="count"></div><div class="complete hidden" id="done">PERFECT! &nbsp; PRESS ENTER TO FINISH</div></div>`;canvas=document.getElementById("canvas");ctx=canvas.getContext("2d");resize();window.onresize=resize;draw();speak(`Measure the ${object[0].toLowerCase()} with ${tool.toLowerCase()}. Press space to add one.`)}
function resize(){if(!canvas)return;let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function draw(){if(!canvas)return;let w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);let bp=Math.min(h*.60/16,30),oh=object[2]*bp,base=h*.88,top=base-oh,ox=w*.30,sx=w*.70;drawObject(object[1],ox,top,base,Math.min(w*.25,330));ctx.fillStyle="#fff";ctx.font="bold 28px Arial";ctx.textAlign="center";ctx.fillText(object[0],ox,Math.min(h-8,base+35));ctx.strokeStyle="#fff";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(sx-150,base);ctx.lineTo(sx+150,base);ctx.stroke();let uh=bp*tools[tool].ratio;for(let i=0;i<units;i++)drawUnit(sx,base-(i+.5)*uh,uh);ctx.strokeStyle="#FFE66D";ctx.setLineDash([16,8]);ctx.beginPath();ctx.moveTo(sx-165,top);ctx.lineTo(sx+165,top);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#FFE66D";ctx.font="bold 24px Arial";ctx.fillText("PERFECT HEIGHT",sx,Math.max(25,top-22));let co=document.getElementById("count");if(co){co.textContent=`${units} ${tools[tool].plural}`;co.style.color=units===target?"#39D98A":"#fff"}}
function drawUnit(x,y,h){ctx.lineWidth=3;if(tool==="BEANS"){ctx.fillStyle="#A66A35";ctx.strokeStyle="#E4B07A";ctx.beginPath();ctx.ellipse(x,y,Math.max(12,h*.48),Math.max(7,h*.30),0,0,7);ctx.fill();ctx.stroke()}else if(tool==="PAPERCLIPS"){ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,Math.max(10,h*.36),.25*Math.PI,1.95*Math.PI);ctx.stroke()}else if(tool==="BUTTONS"){ctx.fillStyle="#D94F70";ctx.strokeStyle="#FFB1C1";ctx.beginPath();ctx.arc(x,y,Math.max(9,h*.38),0,7);ctx.fill();ctx.stroke();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x-h*.12,y-h*.08,3,0,7);ctx.fill();ctx.beginPath();ctx.arc(x+h*.12,y+h*.08,3,0,7);ctx.fill()}else{let bh=Math.max(14,h*.9),bw=bh*.7;ctx.fillStyle="#4E9AF1";ctx.strokeStyle="#A9D8FF";ctx.fillRect(x-bw/2,y-bh/2,bw,bh);ctx.strokeRect(x-bw/2,y-bh/2,bw,bh)}}
function drawObject(k,cx,top,base,size){let h=base-top;ctx.lineWidth=5;ctx.strokeStyle="#fff";if(k==="pumpkin"){ctx.fillStyle="#FF9F43";for(let q of [[-.3,.3],[-.15,.4],[0,.43],[.15,.4],[.3,.3]]){let rx=size*q[1]/2;ctx.beginPath();ctx.ellipse(cx+size*q[0],top+h*.54,rx,h*.42,0,0,7);ctx.fill();ctx.stroke()}ctx.fillStyle="#5E7F22";ctx.fillRect(cx-14,top,28,Math.max(12,h*.1))}else if(k==="house"){let roof=h*.28,body=top+roof,half=size*.38;ctx.fillStyle="#D97B66";ctx.fillRect(cx-half,body,half*2,base-body);ctx.strokeRect(cx-half,body,half*2,base-body);ctx.fillStyle="#8E5A3C";ctx.beginPath();ctx.moveTo(cx-half*1.25,body);ctx.lineTo(cx,top);ctx.lineTo(cx+half*1.25,body);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle="#654321";ctx.fillRect(cx-25,base-90,50,90);ctx.fillStyle="#8ED1FC";ctx.fillRect(cx-half*.55,body+h*.12,42,42);ctx.fillRect(cx+half*.18,body+h*.12,42,42)}else if(k==="tree"){ctx.fillStyle="#8B5A2B";ctx.fillRect(cx-25,base-h*.42,50,h*.42);ctx.strokeRect(cx-25,base-h*.42,50,h*.42);ctx.fillStyle="#39A852";ctx.beginPath();ctx.ellipse(cx,top+h*.27,size*.41,h*.29,0,0,7);ctx.fill();ctx.stroke()}else if(k==="flower"||k==="sunflower"){ctx.strokeStyle="#39D98A";ctx.lineWidth=Math.max(5,h*.035);ctx.beginPath();ctx.moveTo(cx,top+h*.34);ctx.lineTo(cx,base);ctx.stroke();let py=top+h*.34,pr=Math.min(40,Math.max(12,h*.1));ctx.fillStyle=k==="sunflower"?"#FFD43B":"#FF5C8A";for(let q of [[-pr,0],[pr,0],[0,-pr],[0,pr]]){ctx.beginPath();ctx.arc(cx+q[0],py+q[1],pr,0,7);ctx.fill()}ctx.fillStyle="#FFE66D";ctx.beginPath();ctx.arc(cx,py,pr*.75,0,7);ctx.fill()}else{ctx.fillStyle="#30303A";ctx.fillRect(cx-size*.35,top,size*.7,h);ctx.strokeRect(cx-size*.35,top,size*.7,h);ctx.fillStyle="#fff";ctx.font="bold 22px Arial";ctx.fillText(k==="uofa"?"U OF A":k.toUpperCase(),cx,(top+base)/2)}}
function add(){if(!canvas||complete)return;units++;draw();if(units===target){complete=true;document.getElementById("done").classList.remove("hidden");confetti();speak(`Perfect! The correct total is ${units} ${tools[tool].plural}. Press Enter to finish.`)}else speak(`${units} ${tools[tool].plural}`)}
function results(){stopConfetti();canvas=null;document.getElementById("app").innerHTML=`<div class="screen"><div class="resultsTitle">GREAT MEASURING!</div><div class="score">SCORE: 100</div><div class="resultsText">You measured the ${object[0].toLowerCase()} perfectly.<br><br>You used ${tool.toLowerCase()}.</div><div class="homeButtons"><button id="again">PLAY AGAIN</button><button id="new">CHOOSE NEW THINGS</button></div></div>`;document.getElementById("again").onclick=startGame;document.getElementById("new").onclick=home;speak("Great measuring! Your score is 100.")}
function confetti(){let b=document.getElementById("confetti"),cs=["#FFE66D","#39D98A","#55B7FF","#FF9F43","#9C4DCC","#FF5C5C","#fff"];b.innerHTML="";for(let i=0;i<120;i++){let p=document.createElement("div");p.className="piece";p.style.left=Math.random()*100+"%";p.style.top=-20-Math.random()*80+"px";p.style.background=cs[Math.floor(Math.random()*cs.length)];p.style.animationDuration=2.2+Math.random()*3+"s";p.style.animationDelay=-Math.random()*3+"s";b.appendChild(p)}}
function stopConfetti(){document.getElementById("confetti").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();add()}else if(e.key==="Enter"){e.preventDefault();if(!canvas)startGame();else if(complete)results();else add()}else if(e.key==="Escape"){e.preventDefault();home()}});
home();
</script>
</body></html>
