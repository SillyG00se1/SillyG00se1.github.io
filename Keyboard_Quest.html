<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keyboard Quest</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071426;color:#fff;font-family:'Trebuchet MS',Verdana,sans-serif}button{font:700 22px 'Trebuchet MS',Verdana,sans-serif;color:#fff;background:#102c4b;border:3px solid #55dfff;border-radius:10px;padding:12px 18px;cursor:pointer}button:hover,button:focus{background:#183d62;outline:3px solid #fff}#app{position:fixed;inset:0}canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.title{font-size:clamp(44px,5vw,68px);color:#55dfff;font-weight:700}.sub{font-size:28px;color:#58e39b;margin:8px}.levels{display:flex;gap:18px;margin:22px;flex-wrap:wrap;justify-content:center}.level{width:205px;height:185px}.level strong{display:block;font-size:27px;margin-bottom:20px}.level span{font-size:15px;color:#bfd7ff}.bonus{background:#18204f;border-color:#b9c7ff}.leader{margin-top:16px;background:#4b3fa6;border-color:#d6c9ff}.hud{position:absolute;z-index:4;top:0;left:0;right:0;height:125px;background:#06101f;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:30px;font-weight:700}.hud .s{color:#ffd166}.hud .h{color:#ff6b81}.hud .a{color:#55dfff}.hud .w{color:#58e39b}.combo{display:none}.result{font-size:30px;margin:9px}.complete{font-size:58px;color:#58e39b;font-weight:700}.gameover{font-size:60px;color:#ff6b81;font-weight:700}.big{font-size:24px;padding:16px 28px;background:#4b3fa6;border-color:#d6c9ff;margin-top:16px}.name{font:700 26px Arial;text-align:center;width:360px;padding:10px}.board{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:7vh;z-index:8}.board h1{font-size:50px;color:#ffd166}.rows{width:min(900px,90vw);font-size:19px}.row{display:grid;grid-template-columns:55px 1fr 80px 110px 130px 100px;padding:9px;background:#111;border-bottom:1px solid #555}.head{background:#333;color:#55dfff;font-weight:700}.top{color:#ffd166}
</style></head><body><div id="app"><canvas id="c"></canvas></div><script>
const c=document.getElementById("c"),x=c.getContext("2d");let W=1200,H=760,D=1,screen="menu",level=Math.max(1,Math.min(5,Number(new URLSearchParams(location.search).get("level"))||1)),running=false,obs=[],parts=[],booms=[],clouds=[],queue=[],score=0,correct=0,wrong=0,combo=0,dist=0,start=0,last=0,spawn=0,mood="normal",moodUntil=0,hurtUntil=0,cloudSet=0,raf=0,nameBox=null,approachSpeed=0,slowUntil=0,successfulHits=0;
const KEYS={1:"asdfjklghei.",2:"asdfjklgheirutywo.",3:"asdfjklgheirutywoqtcmvb.",4:"asdfjklgheirutywoqtcmvbnxz;.",5:"abcdefghijklmnopqrstuvwxyz.;",6:"1234567890"},NAMES={1:"LESSONS 1-3",2:"LESSONS 4-6",3:"LESSONS 7-9",4:"LESSONS 10-12",5:"LESSONS 13-15",6:"NUMBER PRACTICE"};
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);draw()}addEventListener("resize",resize);function gy(){return H*.79}function txt(a,b,s,z,col="#fff",al="center"){x.fillStyle=col;x.font="700 "+z+"px 'Trebuchet MS',Verdana,sans-serif";x.textAlign=al;x.textBaseline="middle";x.fillText(s,a,b)}
function scores(){try{return JSON.parse(localStorage.getItem("keyboardQuestLeaderboard")||"[]")}catch(e){return[]}}function saveScores(a){localStorage.setItem("keyboardQuestLeaderboard",JSON.stringify(a.slice(0,50)))}function stats(){let t=Math.max(.1,(performance.now()-start)/1000);return{acc:correct/Math.max(1,correct+wrong)*100,wpm:(correct/5)/(t/60)}}function addScore(n="Player"){let s=stats(),a=scores();a.push({name:(n||"Player").trim()||"Player",level:level,score:score,accuracy:+s.acc.toFixed(1),wpm:+s.wpm.toFixed(1),date:new Date().toISOString().slice(0,10)});a.sort((a,b)=>b.score-a.score||b.accuracy-a.accuracy||b.wpm-a.wpm);saveScores(a)}
function topTen(){let a=scores().sort((a,b)=>b.score-a.score);return a.length<10||score>(a[9]?.score||0)}
const CP=[[[.12,.22,72],[.31,.18,58],[.5,.25,82],[.69,.17,62],[.86,.27,70]],[[.08,.16,55],[.23,.3,88],[.43,.14,65],[.62,.3,52],[.82,.18,92]],[[.16,.29,95],[.36,.13,48],[.55,.28,60],[.74,.14,84],[.92,.31,50]],[[.05,.25,65],[.27,.2,50],[.47,.31,96],[.7,.21,55],[.9,.13,75]],[[.1,.12,48],[.3,.27,105],[.52,.16,58],[.75,.3,72],[.95,.2,52]]];function cloudsMake(){clouds=CP[cloudSet].map(a=>({x:a[0]*W,y:a[1]*H,z:a[2],v:8+a[2]%13}))}
function bg(menu=false){let L=(menu?["#f4c56a","#c69a52","#d9ad63","#b98543"]:[["#8fd3ff","#4d9a4a","#6faf5a","#4b8f45"],["#f4c56a","#c69a52","#d9ad63","#b98543"],["#9ed9ff","#3f8145","#4f8f50","#35733d"],["#8fd4ff","#4e9b42","#72b84f","#4a963e"],["#a9e4ff","#5a9b58","#77b86b","#4c9451"],["#090b2e","#26294f","#15183d","#26294f"]][level-1]);x.fillStyle=L[0];x.fillRect(0,0,W,H);x.fillStyle="#fff1a8";x.beginPath();x.arc(W*.76,H*.13+35,35,0,7);x.fill();for(let q of clouds){x.fillStyle="#fff";x.beginPath();x.ellipse(q.x-q.z*.5,q.y,q.z*.55,q.z*.28,0,0,7);x.ellipse(q.x,q.y-q.z*.18,q.z*.4,q.z*.4,0,0,7);x.ellipse(q.x+q.z*.42,q.y,q.z*.52,q.z*.3,0,0,7);x.fill()}let g=gy();x.fillStyle=L[2];x.beginPath();x.moveTo(0,g);for(let i=0;i<=9;i++)x.lineTo(i*W/9,g-115-28*Math.sin(i/9*Math.PI*2));x.lineTo(W,g+20);x.lineTo(0,g+20);x.fill();x.fillStyle=L[3];x.beginPath();x.moveTo(0,g+20);for(let i=0;i<=9;i++)x.lineTo(i*W/9,g-55-22*Math.sin(i/9*Math.PI*2));x.lineTo(W,g+20);x.lineTo(0,g+20);x.fill();let type=menu?"desert":["mountains","desert","trees","corn","coast","space"][level-1];if(type==="mountains")for(let q=-120;q<W+300;q+=300){x.fillStyle="#5d7f72";x.beginPath();x.moveTo(q,g);x.lineTo(q+145,g-210);x.lineTo(q+290,g);x.fill()}if(type==="desert"){x.fillStyle="#5f8745";for(let q=-100;q<W+300;q+=300){x.fillRect(q,g-105,14,105);x.fillRect(q-24,g-82,38,14)}}if(type==="trees")for(let q=-120;q<W+300;q+=180){x.fillStyle="#795548";x.fillRect(q-7,g-125,14,125);x.fillStyle="#2e7040";x.beginPath();x.arc(q,g-130,50,0,7);x.fill()}if(type==="corn")for(let q=-80;q<W+200;q+=120){x.strokeStyle="#2f7135";x.lineWidth=7;x.beginPath();x.moveTo(q,g);x.lineTo(q,g-110);x.stroke()}if(type==="coast"){x.fillStyle="#69b7d4";x.fillRect(0,g-105,W,105)}if(type==="space"){x.fillStyle="#fff";for(let i=0;i<42;i++)x.fillRect((i*173)%W,130+((i*97)%(g-280)),2,2)}x.fillStyle=L[1];x.fillRect(0,g,W,H-g);x.fillStyle="#fff";x.fillRect(0,g,W,4);x.strokeStyle=L[3];x.lineWidth=6;for(let q=-100;q<W+120;q+=90){x.beginPath();x.moveTo(q,g+30);x.lineTo(q+38,g+30);x.stroke()}}
function moveClouds(dt){for(let q of clouds){q.x-=q.v*dt;if(q.x<-220)q.x=W+30+Math.random()*230}}
function player(){let w=58,h=78,p=210,y=gy()+Math.sin(performance.now()/1000*22)*3.5;x.fillStyle="#06101f";x.beginPath();x.ellipse(p,gy()+9,44,7,0,0,7);x.fill();x.fillStyle=performance.now()<hurtUntil?"#ff4d6d":"#ffd166";x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();x.ellipse(p,y-h/2,w/2,h/2,0,0,7);x.fill();x.stroke();let ey=y-h*.67;x.fillStyle="#071426";x.beginPath();x.arc(p-10,ey,5,0,7);x.arc(p+10,ey,5,0,7);x.fill();let m=performance.now()<moodUntil?mood:"normal";x.strokeStyle="#071426";x.lineWidth=4;x.beginPath();if(m==="happy")x.arc(p,ey+14,13,0,Math.PI);else if(m==="normal"){x.moveTo(p-9,ey+16);x.lineTo(p+9,ey+16)}else{x.fillStyle="#071426";x.arc(p,ey+15,7,0,7);x.fill()}x.stroke();let ph=Math.sin(performance.now()/1000*11);x.strokeStyle="#fff";x.lineWidth=8;x.beginPath();x.moveTo(p-10,y-6);x.lineTo(p-30+ph*12,y+17);x.moveTo(p+9,y-6);x.lineTo(p+30+ph*12,y+17);x.moveTo(p-20,y-h*.43);x.lineTo(p-38,y-h*.18);x.moveTo(p+20,y-h*.43);x.lineTo(p+38,y-h*.18);x.stroke()}
function types(){return level===1?["JUMP"]:level===2?["JUMP","SLIDE"]:level===3?["JUMP","SLIDE","DEFUSE"]:level===4?["JUMP","SLIDE","DEFUSE","JUMP"]:["JUMP","SLIDE","DEFUSE","JUMP","SLIDE"]}function spawnObstacle(){if(!queue.length)queue=shuffleArray([...KEYS[level]]);obs.push({x:W+50+Math.random()*200,key:queue.pop(),action:types()[Math.floor(Math.random()*types().length)],pulse:Math.random()*7,passed:false,flash:0})}
function geo(o){return o.action==="JUMP"?[62,78,gy()]:o.action==="SLIDE"?[130,34,gy()-112]:[76,76,gy()-80]}
function obstacle(o){let q=geo(o),ow=q[0],oh=q[1],oy=q[2],p=o.x,f=performance.now()<o.flash;if(o.action==="JUMP"){x.fillStyle=f?"#ff334d":"#b86b35";x.strokeStyle=f?"#fff":"#ffd166";x.lineWidth=4;x.fillRect(p-31,oy-oh,62,oh);x.strokeRect(p-31,oy-oh,62,oh)}else if(o.action==="SLIDE"){x.fillStyle=f?"#ff334d":"#7c5cfc";x.strokeStyle=f?"#fff":"#d6c9ff";x.lineWidth=4;x.fillRect(p-65,oy-oh,130,oh);x.strokeRect(p-65,oy-oh,130,oh);x.fillStyle="#382878";x.fillRect(p-57,oy-oh+8,114,oh-16)}else{x.fillStyle=f?"#ff334d":"#c72c5a";x.strokeStyle=f?"#fff":"#ffb3c1";x.lineWidth=4;x.beginPath();x.arc(p,oy-oh/2,38,0,7);x.fill();x.stroke();x.strokeStyle="#ffd166";x.lineWidth=4;x.beginPath();x.moveTo(p,oy-oh/2-38);x.lineTo(p+18,oy-oh/2-56);x.stroke()}let py=oy-oh-68;x.fillStyle="#071426";x.strokeStyle="#55dfff";x.lineWidth=3;x.beginPath();x.ellipse(p,py,100,86,0,0,7);x.fill();x.stroke();txt(p,py,o.key.toLowerCase(),92,"#fff","center")}
function burst(px,py,good){let cs=good?["#58e39b","#55dfff","#ffd166","#fff"]:["#ff4d6d","#ff9aae","#ffd166"];for(let i=0;i<18;i++){let a=Math.random()*7,v=90+Math.random()*220;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.3+Math.random()*.45,col:cs[Math.floor(Math.random()*cs.length)]})}}
function effects(dt){let a=[];for(let p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.life-=dt;if(p.life>0){a.push(p);x.globalAlpha=p.life;x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,5,0,7);x.fill()}}x.globalAlpha=1;parts=a;let b=[];for(let z of booms){let r=z.r;x.strokeStyle="#fff176";x.lineWidth=6;x.beginPath();x.arc(z.x,z.y,r,0,7);x.stroke();x.strokeStyle="#ff8a00";x.lineWidth=4;x.beginPath();x.arc(z.x,z.y,r*1.7,0,7);x.stroke();z.r+=8;z.life--;if(z.life>0)b.push(z)}booms=b}
function hud(){let s=stats();x.fillStyle="#06101f";x.fillRect(0,0,W,125);txt(28,62,"LEVEL "+level,30,"#fff","left");txt(W*.18,62,"SCORE: "+score,30,"#ffd166","left");if(combo>=2)txt(W*.45,62,"COMBO x"+combo+"!",27,"#ffd166");txt(W*.62,62,"ACC: "+s.acc.toFixed(0)+"%",30,"#55dfff","left");txt(W*.82,62,"WPM: "+s.wpm.toFixed(0),30,"#58e39b","left")}
function target(){return obs.filter(o=>!o.passed).sort((a,b)=>a.x-b.x)[0]||null}function hit(o){combo++;score+=100+Math.max(0,combo-1)*25;correct++;successfulHits++;mood="happy";moodUntil=performance.now()+550;let q=geo(o);booms.push({x:o.x,y:q[2]-15,r:12,life:13});obs.splice(obs.indexOf(o),1)}function miss(o){wrong++;combo=0;mood="surprised";moodUntil=performance.now()+450;hurtUntil=performance.now()+650;slowUntil=performance.now()+650;if(o)o.flash=performance.now()+450}
function loop(now){if(!running)return;let dt=Math.min(.035,(now-last)/1000||.016);last=now;moveClouds(dt);spawn+=dt;

  // Speed is based on level, not elapsed time. A wrong answer briefly slows
  // the approaching letters so the student gets a little recovery time.
  const baseSpeed=250+(level-1)*55;
  // Each successfully typed letter makes the approach a little faster.
  // The increase is gradual and capped so it remains playable.
  const ramp=Math.min(150,successfulHits*7);
  const slowed=performance.now()<slowUntil;
  const speed=(baseSpeed+ramp)*(slowed?.62:1);
  approachSpeed=speed;

  // Keep a single clear target approaching the character. New letters are
  // introduced only after the previous one has been successfully typed.
  if(!obs.length && spawn>=.55){
    spawn=0;
    spawnObstacle();
  }

  for(let o of [...obs]){
    o.x-=speed*dt;
    o.pulse+=dt*6;

    // The first letter reaches the character here. There is no timer or
    // distance-based completion condition.
    if(o.x<=135&&!o.passed){
      o.passed=true;
      combo=0;
      mood="surprised";
      moodUntil=performance.now()+650;
      hurtUntil=performance.now()+650;
      burst(210,gy()-40,false);
      obs.splice(obs.indexOf(o),1);
      finish();
      return;
    }
  }

  draw();
  raf=requestAnimationFrame(loop)}
function shuffleArray(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(n){level=n||level;clearUI();cancelAnimationFrame(raf);screen="game";running=true;score=correct=wrong=0;combo=0;dist=0;obs=[];parts=[];booms=[];approachSpeed=0;slowUntil=0;successfulHits=0;queue=shuffleArray([...KEYS[level]]);start=last=performance.now();spawn=0;cloudsMake();spawnObstacle();raf=requestAnimationFrame(loop)}
function finish(){if(!running)return;running=false;cancelAnimationFrame(raf);raf=0;screen="game_over";addScore();draw()}function completeLevel(){running=false;screen="level_complete";if(topTen())completeUI(true);else{addScore();completeUI(false)}}
function clearUI(){document.querySelectorAll(".overlay,.hud,.combo,.board").forEach(e=>e.remove());if(nameBox){nameBox.remove();nameBox=null}}function menu(){running=false;cancelAnimationFrame(raf);screen="menu";clearUI();cloudsMake();draw()}
function menuUI(){clearUI();let d=document.createElement("div");d.className="overlay";let s=[1,2,3,4,5].map(i=>'<button class="level" onclick="startGame('+i+')"><strong>LEVEL '+i+'</strong><span>'+NAMES[i]+'</span></button>').join("");d.innerHTML='<div class="title">KEYBOARD QUEST</div><div class="sub">A TYPING PLATFORMER</div><div style="font-size:26px;margin-top:25px">Choose a level</div><div class="levels">'+s+'</div><button class="bonus" onclick="startGame(6)">BONUS: NUMBER BLAST<br><small>TYPE 0–9</small></button><button class="leader" onclick="showBoard()">LEADERBOARD</button>';document.getElementById("app").appendChild(d)}
function completeUI(need){clearUI();let s=stats(),d=document.createElement("div");d.className="overlay";const nextLesson=Number(sessionStorage.getItem("typingUnitNextLesson")||0);d.innerHTML='<div class="complete">LEVEL '+level+' COMPLETE!</div><div class="result">SCORE: '+score+'</div><div class="result" style="color:#55dfff">ACCURACY: '+s.acc.toFixed(1)+'%</div><div class="result" style="color:#ffd166">WPM: '+s.wpm.toFixed(1)+'</div>';if(need)d.innerHTML+='<div style="color:#ffd166;font-size:25px;margin-top:10px">TOP 10 SCORE! ENTER YOUR NAME:</div><input id="kqName" class="name" maxlength="20"><button class="big" onclick="saveLevel()">SAVE SCORE</button><div style="color:#bfd7ff;margin-top:12px">Press ENTER to save your score</div>';else if(nextLesson&&nextLesson<=15)d.innerHTML+='<div class="result">NEXT: LESSON '+nextLesson+' LEVEL 1</div><button class="big" onclick="continueToTypingUnit()">NEXT LESSON</button>';else if(level<5)d.innerHTML+='<div class="result">NEXT: LEVEL '+(level+1)+'</div><button class="big" onclick="startGame('+(level+1)+')">NEXT LESSON</button>';else d.innerHTML+='<div class="result" style="color:#ffd166">YOU BEAT ALL 5 LEVELS!</div><button class="big" onclick="startGame(1)">PLAY AGAIN</button>';d.innerHTML+='<div style="color:#bfd7ff;margin-top:14px">ESC = MENU</div>';document.getElementById("app").appendChild(d);if(need){nameBox=document.getElementById("kqName");nameBox.focus();nameBox.onkeydown=e=>{if(e.key==="Enter")saveLevel()}}}
function continueToTypingUnit(){const nextLesson=Number(sessionStorage.getItem("typingUnitNextLesson")||0);sessionStorage.removeItem("typingUnitNextLesson");sessionStorage.setItem("typingUnitReturn","1");window.location.href="Typing_Unit.html?lesson="+encodeURIComponent(nextLesson)+"&level=1"}
function saveLevel(){let n=nameBox&&nameBox.value.trim();if(!n){alert("Please enter a name.");return}addScore(n);nameBox=null;completeUI(false)}
function overUI(){clearUI();let s=stats(),d=document.createElement("div");d.className="overlay";const nextLesson=Number(sessionStorage.getItem("typingUnitNextLesson")||0);d.innerHTML='<div class="gameover">OH NO!</div><div class="result">Oops! You ran into some trouble.</div><div class="result" style="color:#ffd166">SCORE: '+score+'</div><div class="result" style="color:#55dfff">ACCURACY: '+s.acc.toFixed(1)+'%</div><div class="result" style="color:#58e39b">WPM: '+s.wpm.toFixed(1)+'</div><div class="result">Press space to try again!</div>';if(nextLesson>=1&&nextLesson<=15)d.innerHTML+='<button class="big" onclick="continueToTypingUnit()">NEXT LESSON</button>';d.innerHTML+='<div style="color:#bfd7ff">ESC = LESSON BANK</div>';document.getElementById("app").appendChild(d)}
function showBoard(){running=false;cancelAnimationFrame(raf);screen="leaderboard";clearUI();let a=scores().sort((a,b)=>b.score-a.score),d=document.createElement("div");d.className="board";let r='<div class="row head"><span>#</span><span>PLAYER</span><span>LEVEL</span><span>SCORE</span><span>ACCURACY</span><span>WPM</span></div>';if(!a.length)r+='<div style="font-size:28px;margin-top:50px">No scores yet!</div>';else a.slice(0,10).forEach((q,i)=>r+='<div class="row '+(i<3?"top":"")+'"><span>'+(i+1)+'</span><span>'+String(q.name).replace(/[&<>]/g,"")+'</span><span>'+q.level+'</span><span>'+q.score+'</span><span>'+Number(q.accuracy).toFixed(1)+'%</span><span>'+Number(q.wpm).toFixed(1)+'</span></div>');d.innerHTML='<h1>LEADERBOARD</h1><div class="rows">'+r+'</div><button class="big" onclick="menu()">BACK TO MENU</button>';document.getElementById("app").appendChild(d)}
function draw(){x.clearRect(0,0,W,H);if(screen==="game"){bg();for(let o of obs)obstacle(o);effects(Math.min(.035,(performance.now()-last)/1000));player();hud();return}bg(true);if(screen==="menu")menuUI();else if(screen==="leaderboard")showBoardUI();else if(screen==="level_complete")completeUI(topTen());else if(screen==="game_over")overUI()}
function showBoardUI(){if(document.querySelector(".board"))return;showBoard()}
addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();const returnPage=new URLSearchParams(location.search).get("return");if(returnPage||sessionStorage.getItem("typingUnitReturn")==="1"){cancelAnimationFrame(raf);raf=0;running=false;window.location.href="Typing_Unit.html"}else{menu()}return}if(e.key==="Tab"&&screen==="menu"){e.preventDefault();cloudSet=(cloudSet+1)%5;cloudsMake();draw();return}if(e.target&&["INPUT","TEXTAREA"].includes(e.target.tagName))return;if(e.key===" "){e.preventDefault();if(screen==="menu"||screen==="game_over")startGame(level);else if(screen==="level_complete"&&!nameBox)(level<5?startGame(level+1):startGame(1));return}if(screen!=="game"||!running)return;let o=target(),k=(e.key||"").toLowerCase();if(!o){wrong++;return}if(k===o.key.toLowerCase())hit(o);else if(k.length===1)miss(o)});
resize();cloudsMake();if(new URLSearchParams(location.search).has("level"))startGame(level);else draw();
</script></body></html>
