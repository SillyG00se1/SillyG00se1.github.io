<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typing Defender</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151a;color:#fff;font-family:"Trebuchet MS",Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
button{font:700 24px "Trebuchet MS",Arial,sans-serif;color:#fff;background:#173449;border:3px solid #68d7ff;border-radius:10px;padding:14px 24px;cursor:pointer}
button:hover,button:focus{background:#24516b;outline:3px solid #fff}
input{font:700 25px Arial,sans-serif;padding:12px;border-radius:8px;border:3px solid #68d7ff;text-align:center}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(5,10,14,.68)}
.panel{width:min(900px,92vw);padding:34px 42px;background:rgba(12,25,34,.96);border:3px solid #5cc9e9;border-radius:18px;box-shadow:0 20px 70px rgba(0,0,0,.55)}
h1{font-size:clamp(48px,6vw,82px);margin:0 0 8px;color:#8fe7ff}
h2{font-size:38px;margin:10px 0 20px;color:#ffd166}
p{font-size:24px;line-height:1.4}
.levels{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:25px 0}
.levels button{min-width:190px;min-height:105px}
.small{font-size:18px;color:#b9d1da}
#hud{position:absolute;left:0;right:0;top:0;height:88px;background:rgba(7,14,19,.93);display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:25px;font-weight:700;z-index:5}
#hud .score{color:#ffd166}#hud .acc{color:#68d7ff}#hud .wpm{color:#6df0a8}#hud .paint{color:#ff7aa8}
#word{position:absolute;left:50%;top:78%;transform:translate(-50%,-50%);z-index:4;font:700 clamp(40px,5vw,72px) "Trebuchet MS",Arial,sans-serif;letter-spacing:4px;color:#fff;text-shadow:0 4px 14px #000;background:rgba(8,16,21,.75);border:4px solid #fff;border-radius:14px;padding:10px 26px;min-width:240px}
#typed{display:none}
 .board{width:min(760px,88vw);margin:12px auto 20px;text-align:left}.board h3{font-size:30px;margin:0 0 8px;color:#ffd166}.board-row{display:grid;grid-template-columns:50px 1fr 120px;gap:12px;padding:7px 12px;border-bottom:1px solid #47606d;font-size:21px}.board-row.head{color:#8fe7ff;font-size:17px;border-bottom:2px solid #68d7ff}.namebox{width:min(360px,80vw);margin:8px auto 14px}</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" hidden>
  <div>LEVEL <span id="levelText">1</span></div>
  <div class="score">SCORE: <span id="score">0</span></div>
  <div class="acc">ACC: <span id="accuracy">100</span>%</div>
  <div class="wpm">WPM: <span id="wpm">0</span></div>
  <div class="paint">PAINTBALLS: <span id="paint">0</span></div>
</div>
<div id="word" hidden></div><div id="typed" hidden></div>
<div id="ui"></div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=1200,H=760,dpr=1,screen="menu",level=1,currentScene=1,running=false,last=0,raf=0;
let score=0,correct=0,wrong=0,typed="",word="",wordIndex=0,startTime=0,combo=0;
let zombies=[],splats=[],particles=[],clouds=[],shake=0,spawnTimer=0,round=0;
const LEVELS={
  1:{name:"LESSONS 1-3",words:["ask","sad","dad","fall","jag","lag","glass","flash","all","flag","add","lass","flask","salad","dash","half","gall","had","has","glad","shall","flail","slag","salsa","sash","halls","falls","flags","gags","jabs","jags","lads","sagas","alas","ash","fad","fads","gala","gals","hags","jazz","slash","hash","shag","lass","glad","slag","dash","flash","flask","salad","shall","all","fall","flag","glass","ask","dad","sad","had","has"],speed:180},
  2:{name:"LESSONS 4-6",words:["fire","ride","rule","fish","free","here","red","there","they","that","this","your","try","stay","write","work","word","world","show","how","after","other","their","those","these","three","where","while","white","whole","house","horse","shirt","short","shore","share","store","story","tower","lower","power","flower","fresh","faster","father","rather","heart","earth","water","wait","wear","year","writer","writing","throw","threw","truth","trust","style","start","stare","stair","first","four","fourth","reward","retire","fire","ride","rule","fish","here","there","they","that","this","your","work","word","show","how"],speed:220},
  3:{name:"LESSONS 7-9",words:["quick","quiet","queen","paper","people","quite","come","same","time","music","make","home","have","very","brave","blue","five","above","movie","move","because","become","number","problem","better","bring","brown","black","climb","clean","clear","could","cover","cream","dream","drive","every","family","famous","field","found","green","group","happy","heavy","image","learn","leave","maybe","money","never","place","please","point","powerful","pretty","purple","question","remove","school","space","speak","speed","spend","spring","square","table","teach","think","under","value","voice","woman","women","young","quick","quiet","queen","paper","people","quite","come","same","time","music","make","home","have","very","brave","blue","five","above","movie","move"],speed:260},
  4:{name:"LESSONS 10-12",words:["next","name","mix","nine","nice","new","box","zip","zero","size","zone","zoo","lazy","amazing","class","last","less","pass","because","small","extra","exact","exist","expect","excuse","example","explain","expand","explore","express","fix","fox","fuzzy","lizard","maximum","mixes","mixed","pixel","relax","six","sixteen","sixty","taxi","text","vex","wax","wizard","xylophone","zebra","zeroes","zigzag","zinc","zipper","zippy","zombie","zoom","zesty","freeze","frozen","boxes","sizes","puzzle","puzzles","exam","exams","exit","exits","index","oxygen","syntax","complex","excellent","exactly","anxiety"],speed:300},
  5:{name:"LESSONS 13-15",words:["hospital","defender","computer","student","excellent","challenge","practice","adventure","keyboard","zombies","pumpkin","patch","skateboard","office","park","building","paintball","accuracy","strength","everything","animation","attention","beautiful","character","characters","classroom","community","creature","different","education","environment","fantastic","friendship","important","information","incredible","instruction","intelligent","interesting","invention","journey","knowledge","language","learning","lightning","materials","mystery","neighborhood","observation","opportunity","paragraph","performance","photograph","playground","population","prediction","preparation","presentation","pronunciation","remember","responsible","scientific","something","sometimes","surprising","technology","temperature","understand","university","wonderful","yesterday","yourself"],speed:340}
};
const LEVEL_CHARACTERS={
  1:new Set("asdfghjkl"),
  2:new Set("asdfghjkle iortuwy".replace(/ /g,"")),
  3:new Set("asdfghjkle iortuwybcmnpqv".replace(/ /g,"")),
  4:new Set("asdfghjkle iortuwybcmnpqxzABCDEFGHIJKLMNOPQRSTUVWXYZ."),
  5:new Set("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ.;")
};
// Capital letters and punctuation are introduced gradually: Level 4 adds capitals
// and the period; Level 5 adds the semicolon.
LEVELS[4].words.push("Next.","Name.","Mix.","Nice.","Zero.");
LEVELS[5].words.push("Hospital.","Defender.","Computer.","Student.","Excellent.","Challenge.","Practice.","Adventure.","Keyboard.","Zombies.","Pumpkin.","Patch.","Skateboard.","Office.","Park.","Building.","Paintball.","Accuracy.","Strength.","Everything.","Animation.","Attention.","Beautiful.","Character.","Classroom.","Community.","Different.","Education.","Fantastic.","Friendship.","Important.","Information.","Incredible.","Instruction.","Interesting.","Journey.","Knowledge.","Language.","Learning.","Mystery.","Neighborhood.","Observation.","Opportunity.","Paragraph.","Performance.","Photograph.","Playground.","Population.","Prediction.","Preparation.","Presentation.","Pronunciation.","Remember.","Responsible.","Scientific.","Something.","Sometimes.","Surprising.","Technology.","Temperature.","Understand.","University.","Wonderful.","Yesterday.","Yourself;","Level five;","Typing practice;");
for(const n of Object.keys(LEVELS)){
 const allowed=LEVEL_CHARACTERS[n];
 LEVELS[n].words=[...new Set(LEVELS[n].words.filter(w=>[...w].every(ch=>allowed.has(ch))))];
}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
addEventListener("resize",resize);
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function ui(html){document.getElementById("ui").innerHTML=html}
function showMenu(){
 running=false;cancelAnimationFrame(raf);screen="menu";document.getElementById("hud").hidden=true;
 document.getElementById("word").hidden=true;document.getElementById("typed").hidden=true;
 ui('<div class="overlay"><div class="panel"><h1>Typing Defender</h1><div class="levels">'+Object.keys(LEVELS).map(n=>'<button onclick="startGame('+n+')">LEVEL '+n+'<br><span style="font-size:17px">'+LEVELS[n].name+'</span></button>').join("")+'<button onclick="showLeaderboard()">LEADERBOARD</button></div></div></div>');
 draw();
}
function startGame(n){
 level=Number(n)||1;currentScene=level;screen="game";running=true;score=correct=wrong=0;typed="";combo=0;round=0;spawnTimer=0;shake=0;startTime=performance.now();
 zombies=[];splats=[];particles=[];clouds=[];
 for(let i=0;i<5;i++)clouds.push({x:Math.random()*W,y:80+Math.random()*170,s:35+Math.random()*70,v:8+Math.random()*12});
 document.getElementById("hud").hidden=false;document.getElementById("word").hidden=false;document.getElementById("typed").hidden=false;
 document.getElementById("levelText").textContent=level;
 ui("");
 newZombie();last=performance.now();raf=requestAnimationFrame(loop);
}
let lastWordByLevel={};
function pickWord(){
 const a=LEVELS[level].words;
 let choices=a.filter(w=>w!==lastWordByLevel[level]);
 if(!choices.length) choices=a;
 const next=choices[Math.floor(Math.random()*choices.length)];
 lastWordByLevel[level]=next;
 return next;
}
function newZombie(){
 word=pickWord();wordIndex=0;typed="";
 let lane=Math.floor(Math.random()*3);
 zombies=[{x:W+100,lane,scale:.86+Math.random()*.16,flash:0,paint:[],speed:LEVELS[level].speed*(.9+Math.random()*.2),walkTime:Math.random()*2.9}];
 round++;
 updateWord();
}
function updateWord(){
 document.getElementById("word").innerHTML=word.split("").map((c,i)=>'<span style="color:'+(i<typed.length?"#6df0a8":"#fff")+'">'+esc(c)+'</span>').join("");
 document.getElementById("typed").textContent="";
}
function drawSky(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#7897a5");g.addColorStop(.52,"#c9d2d0");g.addColorStop(1,"#66716f");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="rgba(255,255,255,.35)";
 for(let c of clouds){ctx.beginPath();ctx.arc(c.x,c.y,c.s*.55,0,Math.PI*2);ctx.arc(c.x+c.s*.5,c.y-8,c.s*.7,0,Math.PI*2);ctx.arc(c.x+c.s,c.y,c.s*.5,0,Math.PI*2);ctx.fill()}
}
function drawHospital(){
 let floor=H*.54;
 ctx.fillStyle="#d9dee0";ctx.fillRect(0,floor,W,H-floor);
 for(let i=0;i<10;i++){ctx.strokeStyle=i%2?"#c1c9cb":"#e9edef";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(i*W/10,floor);ctx.lineTo(i*W/10-150,H);ctx.stroke()}
 ctx.fillStyle="#8b969a";ctx.fillRect(0,floor-18,W,18);
 ctx.fillStyle="#edf1f2";ctx.fillRect(0,120,W,80);
 ctx.fillStyle="#b7c2c5";ctx.fillRect(0,200,W,8);
 for(let i=0;i<7;i++){let x=80+i*180;ctx.fillStyle="#fff";ctx.fillRect(x,137,100,20);ctx.fillStyle="#d9e2e4";ctx.fillRect(x+8,142,84,10)}
 // windows
 for(let i=0;i<5;i++){let x=70+i*250;ctx.fillStyle="#6f9caf";ctx.fillRect(x,245,170,130);ctx.strokeStyle="#e6ecee";ctx.lineWidth=8;ctx.strokeRect(x,245,170,130);ctx.beginPath();ctx.moveTo(x+85,245);ctx.lineTo(x+85,375);ctx.moveTo(x,310);ctx.lineTo(x+170,310);ctx.stroke()}
 // nurse station / desk
 ctx.fillStyle="#8e6e55";ctx.fillRect(W*.04,floor-65,W*.18,65);ctx.fillStyle="#b38b68";ctx.fillRect(W*.055,floor-88,W*.15,25);
 // medical cart
 ctx.fillStyle="#cbd4d6";ctx.fillRect(W*.72,floor-100,120,100);ctx.fillStyle="#7b8a8e";ctx.fillRect(W*.72,floor-100,120,12);
 ctx.strokeStyle="#667276";ctx.lineWidth=5;ctx.strokeRect(W*.72,floor-100,120,100);
 ctx.fillStyle="#d74b55";ctx.fillRect(W*.75,floor-70,50,18);
 ctx.fillStyle="#fff";ctx.font="700 24px Arial";ctx.fillText("+",W*.79,floor-55);
 // doors
 for(let i=0;i<2;i++){let x=W*.32+i*250;ctx.fillStyle="#a9b5b8";ctx.fillRect(x,floor-150,150,150);ctx.fillStyle="#647378";ctx.fillRect(x+12,floor-138,126,126);ctx.fillStyle="#d9e3e5";ctx.fillRect(x+25,floor-120,88,65);ctx.fillStyle="#f5c94b";ctx.fillRect(x+115,floor-80,8,20)}
}
function drawLevelOneCartoonZombie(z,drawHead=true){
 const y=H*.53+z.lane*H*.12,s=z.scale,phase=(z.walkTime||0)*5,w=Math.sin(phase)*.24,I="#273a32",S=({1:"#315b32",2:"#9bc86c",3:"#92999b",4:"#b2cf45",5:"#b9dca3"})[currentScene]||"#9bc86c",B="#b9dfe0";
 ctx.save();ctx.translate(z.x,y);ctx.scale(-s,s);ctx.lineCap="round";ctx.lineJoin="round";
 // Walking legs pivot at the hips. Each leg keeps a single fixed knee bend that points left;
 // only the whole leg swings from its hip, so the knee itself does not wobble independently.
 ctx.fillStyle="rgba(0,0,0,.2)";ctx.beginPath();ctx.ellipse(0,5,42,9,0,0,7);ctx.fill();
 const leg=(hipX,angle)=>{
  ctx.save();ctx.translate(hipX,-39);ctx.rotate(angle+20*Math.PI/180);
  // Mirror the leg across its vertical axis so the knee bend and foot face the intended direction.
  ctx.scale(-1,1);
  ctx.strokeStyle=I;ctx.lineWidth=17;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-18,28);ctx.lineTo(-30,64);ctx.stroke();
  ctx.strokeStyle=S;ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-18,28);ctx.lineTo(-30,62);ctx.stroke();
  ctx.fillStyle=I;ctx.beginPath();ctx.ellipse(-34,68,18,8,-.08,0,Math.PI*2);ctx.fill();
  ctx.restore();
 };
 leg(-9,w);leg(8,-w);
 // Pants follow the same hip-pivoted motion as the legs.
 if(currentScene!==1){
  const pants=currentScene===2?"#26343e":currentScene===3?"#555b60":currentScene===4?"#34313b":"#4d4c4a";
  ctx.fillStyle=pants;
  for(const p of [{x:-9,a:w},{x:8,a:-w}]){
   ctx.save();ctx.translate(p.x,-69);ctx.rotate(p.a);
   ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(8,0);ctx.lineTo(9,29);ctx.lineTo(-9,29);ctx.closePath();ctx.fill();
   ctx.restore();
  }
  ctx.strokeStyle="#101820";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-1,-68);ctx.lineTo(-1,-40);ctx.stroke();
 }
 // Neck and body.
 ctx.fillStyle=I;ctx.beginPath();ctx.roundRect(-8,-137,19,27,5);ctx.fill();ctx.fillStyle=S;ctx.beginPath();ctx.roundRect(-5,-135,13,24,4);ctx.fill();
 ctx.fillStyle=I;ctx.beginPath();ctx.moveTo(-19,-112);ctx.quadraticCurveTo(-4,-126,11,-112);ctx.lineTo(23,-91);ctx.lineTo(19,-37);ctx.lineTo(11,-32);ctx.lineTo(4,-38);ctx.lineTo(-4,-32);ctx.lineTo(-12,-38);ctx.lineTo(-21,-33);ctx.lineTo(-24,-91);ctx.closePath();ctx.fill();
 // Scene-specific outfits: preserve the hospital gown on Level 1 and dress the other levels for their settings.
 ctx.beginPath();ctx.moveTo(-16,-110);ctx.quadraticCurveTo(-4,-120,8,-109);ctx.lineTo(18,-90);
 if(currentScene===1){ctx.lineTo(15,-41);ctx.lineTo(10,-38);ctx.lineTo(4,-43);ctx.lineTo(-4,-37);ctx.lineTo(-12,-43);ctx.lineTo(-18,-38);}
 else {ctx.lineTo(15,-67);ctx.lineTo(-18,-67);}
 ctx.lineTo(-20,-91);ctx.closePath();
 ctx.fillStyle=currentScene===1?B:currentScene===2?"#39434b":currentScene===3?"#3d9a55":currentScene===4?"#7651a1":"#e87828";ctx.fill();
 if(currentScene===1){
  ctx.strokeStyle="#639fa5";ctx.lineWidth=2;for(let yy=-99;yy<-48;yy+=14){ctx.beginPath();ctx.moveTo(-13,yy);ctx.lineTo(11,yy+4);ctx.stroke()}
 }else if(currentScene===2){
  // Office outfit: collared shirt, narrow tie, and jacket lapels.
  ctx.fillStyle="#e8e8df";ctx.beginPath();ctx.moveTo(-9,-113);ctx.lineTo(1,-104);ctx.lineTo(9,-113);ctx.lineTo(6,-89);ctx.lineTo(-3,-89);ctx.closePath();ctx.fill();
  ctx.fillStyle="#b83d45";ctx.beginPath();ctx.moveTo(-2,-103);ctx.lineTo(2,-103);ctx.lineTo(5,-80);ctx.lineTo(0,-75);ctx.lineTo(-4,-80);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#111820";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-10,-111);ctx.lineTo(-3,-96);ctx.lineTo(-8,-91);ctx.moveTo(9,-111);ctx.lineTo(4,-96);ctx.lineTo(8,-91);ctx.stroke();
 }else if(currentScene===3){
  // Park outfit: casual green tee with a bright pocket.
  ctx.fillStyle="#b4e36c";ctx.fillRect(5,-91,8,10);ctx.strokeStyle="#286d3c";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-12,-94);ctx.lineTo(10,-90);ctx.stroke();
 }else if(currentScene===4){
  // Skatepark outfit: purple hoodie with drawstrings and a front pouch.
  ctx.strokeStyle="#d9c7f5";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-5,-104);ctx.lineTo(-6,-87);ctx.moveTo(3,-104);ctx.lineTo(5,-87);ctx.stroke();
  ctx.fillStyle="#5b3b80";ctx.beginPath();ctx.moveTo(-12,-72);ctx.lineTo(10,-72);ctx.lineTo(12,-57);ctx.lineTo(-14,-57);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#d9c7f5";ctx.stroke();
 }else if(currentScene===5){
  // Pumpkin patch outfit: orange flannel with dark crossing checks.
  ctx.strokeStyle="#713d2c";ctx.lineWidth=3;
  for(let xx=-12;xx<=10;xx+=10){ctx.beginPath();ctx.moveTo(xx,-107);ctx.lineTo(xx+2,-43);ctx.stroke()}
  for(let yy=-96;yy<=-54;yy+=14){ctx.beginPath();ctx.moveTo(-17,yy);ctx.lineTo(15,yy+2);ctx.stroke()}
  ctx.fillStyle="#e7c8a2";ctx.fillRect(-3,-101,6,7);
 }
 // The arm is drawn after the trousers and shirt so it stays visibly in front.
 ctx.strokeStyle=I;ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(2,-99);ctx.lineTo(-7,-78);ctx.lineTo(2,-61);ctx.stroke();
 ctx.strokeStyle=S;ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(2,-99);ctx.lineTo(-7,-78);ctx.lineTo(2,-61);ctx.stroke();
 ctx.fillStyle=I;ctx.beginPath();ctx.ellipse(3,-57,9,7,-.2,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=S;ctx.beginPath();ctx.ellipse(3,-58,6,4,-.2,0,Math.PI*2);ctx.fill();

 ctx.restore();
}
function zombie(z){
 drawLevelOneCartoonZombie(z,false);
 const y=H*.53+z.lane*H*.12,s=z.scale,I="#000000",S=({1:"#315b32",2:"#9bc86c",3:"#92999b",4:"#b2cf45",5:"#b9dca3"})[currentScene]||"#9bc86c";
 ctx.save();ctx.translate(z.x,y);ctx.scale(-s,s);
 // All levels share the same head size, limb-matching green, and fine 1 pt black contour.
 ctx.save();ctx.translate(0,-160);ctx.scale(1.05,1.05);ctx.translate(0,160);
 ctx.fillStyle=S;ctx.strokeStyle=I;ctx.lineWidth=1.333;ctx.lineJoin="round";
 ctx.beginPath();ctx.moveTo(-17,-185);ctx.bezierCurveTo(-5,-194,13,-190,23,-179);ctx.bezierCurveTo(32,-169,31,-155,23,-147);ctx.bezierCurveTo(19,-143,17,-138,13,-134);ctx.bezierCurveTo(5,-127,-6,-130,-13,-137);ctx.bezierCurveTo(-20,-144,-25,-155,-24,-166);ctx.bezierCurveTo(-24,-175,-22,-181,-17,-185);ctx.closePath();ctx.fill();ctx.stroke();
 // Hair styling differs by scene: business zombie is bald; others sweep backward.
 if(level!==2){
  ctx.fillStyle="#273a32";
  if(level===4){
   // Long hair covers the rear scalp and hangs down behind the ear/neck.
   ctx.beginPath();ctx.moveTo(-18,-179);ctx.quadraticCurveTo(-31,-185,-30,-168);ctx.lineTo(-29,-143);ctx.quadraticCurveTo(-27,-137,-23,-145);ctx.lineTo(-20,-157);ctx.quadraticCurveTo(-18,-166,-12,-173);ctx.quadraticCurveTo(-4,-180,7,-177);ctx.quadraticCurveTo(22,-176,27,-177);ctx.quadraticCurveTo(24,-190,9,-188);ctx.quadraticCurveTo(0,-197,-11,-188);ctx.quadraticCurveTo(-25,-190,-18,-179);ctx.closePath();
  }else{
   // A swept-back cap wraps down over the rear curve instead of sitting like a toupee.
   ctx.beginPath();ctx.moveTo(-22,-173);ctx.quadraticCurveTo(-29,-179,-28,-166);ctx.lineTo(-25,-157);ctx.quadraticCurveTo(-23,-153,-19,-160);ctx.lineTo(-15,-174);ctx.quadraticCurveTo(-10,-180,-2,-180);ctx.quadraticCurveTo(10,-182,18,-178);ctx.quadraticCurveTo(26,-178,27,-177);ctx.quadraticCurveTo(24,-190,9,-188);ctx.quadraticCurveTo(0,-197,-11,-188);ctx.quadraticCurveTo(-25,-190,-22,-173);ctx.closePath();
  }
  ctx.fill();ctx.stroke();
 }
 // One visible eye, shifted 2 pixels forward toward the nose on every level.
 ctx.save();ctx.translate(14,0);
 ctx.fillStyle="#000";ctx.beginPath();ctx.moveTo(-14,-166);ctx.lineTo(-8,-175);ctx.lineTo(4,-173);ctx.lineTo(13,-165);ctx.lineTo(1,-168);ctx.closePath();ctx.fill();
 ctx.fillStyle="#fff0a5";ctx.beginPath();ctx.ellipse(-1,-158,level===3?8:7,level===3?9:8,-.15,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#000";ctx.lineWidth=1.333;ctx.stroke();
 ctx.fillStyle="#000";ctx.beginPath();ctx.arc(level===4?0:1,-157,level===3?4:3,0,Math.PI*2);ctx.fill();
 ctx.restore();
 // Consistent green nose and a readable crooked grin.
 // No separate outlined nose: keep the profile smooth and integrated into the face.
 ctx.fillStyle=S;ctx.beginPath();ctx.moveTo(8,-155);ctx.lineTo(20,-153);ctx.lineTo(25,-149);ctx.lineTo(22,-146);ctx.lineTo(14,-146);ctx.lineTo(8,-150);ctx.closePath();ctx.fill();
 ctx.fillStyle="#000";ctx.beginPath();
 if(level===2){ctx.moveTo(8,-151);ctx.lineTo(27,-153);ctx.lineTo(25,-143);ctx.lineTo(12,-141);ctx.closePath();}
 else if(level===3){ctx.moveTo(17,-151);ctx.lineTo(38,-151);ctx.lineTo(39,-146);ctx.lineTo(32,-139);ctx.lineTo(18,-141);ctx.closePath();}
 else if(level===4){ctx.moveTo(-7,-144);ctx.lineTo(13,-146);ctx.lineTo(8,-135);ctx.lineTo(-3,-136);ctx.closePath();}
 else if(level===5){ctx.moveTo(4,-151);ctx.lineTo(20,-151);ctx.lineTo(25,-146);ctx.lineTo(18,-141);ctx.lineTo(6,-143);ctx.closePath();}
 else {ctx.moveTo(-8,-145);ctx.lineTo(0,-142);ctx.lineTo(9,-143);ctx.lineTo(16,-146);ctx.lineTo(14,-138);ctx.lineTo(7,-133);ctx.lineTo(-2,-135);ctx.lineTo(-10,-140);ctx.closePath();}
 ctx.fill();
 ctx.fillStyle="#f8edc6";
 if(level===2){ctx.fillRect(10,-150,4,5);ctx.fillRect(19,-150,4,5);}
 else if(level===3){ctx.fillRect(12,-146,5,5);}
 else if(level===4){ctx.beginPath();ctx.moveTo(1,-143);ctx.lineTo(5,-143);ctx.lineTo(4,-138);ctx.closePath();ctx.fill();}
 else if(level===5){ctx.fillRect(10,-147,4,4);}
 else {ctx.beginPath();ctx.moveTo(-3,-142);ctx.lineTo(2,-141);ctx.lineTo(1,-136);ctx.lineTo(-2,-137);ctx.closePath();ctx.fill();}


 // Scene props carried in front of the body.
  if(level===2){
   ctx.save();ctx.translate(19,-63);ctx.rotate(-.12);
   ctx.fillStyle="#4b3024";ctx.strokeStyle="#171c20";ctx.lineWidth=2.5;
   ctx.beginPath();ctx.roundRect(-17,-17,34,30,4);ctx.fill();ctx.stroke();
   ctx.strokeStyle="#c49a56";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-7,-17);ctx.lineTo(-7,-23);ctx.quadraticCurveTo(0,-28,7,-23);ctx.lineTo(7,-17);ctx.stroke();
   ctx.fillStyle="#d9b56b";ctx.fillRect(-3,-4,6,7);ctx.strokeStyle="#d9b56b";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-17,-1);ctx.lineTo(17,-1);ctx.stroke();
   ctx.restore();
  }
  if(level===3){
   ctx.save();ctx.translate(19,-62);ctx.rotate(-.10);
   ctx.strokeStyle="#6c4225";ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-5,19,Math.PI,Math.PI*2);ctx.stroke();
   ctx.fillStyle="#c58a45";ctx.strokeStyle="#69401f";ctx.lineWidth=2;
   ctx.beginPath();ctx.roundRect(-20,-7,40,25,4);ctx.fill();ctx.stroke();
   ctx.strokeStyle="#8d5b2d";ctx.lineWidth=2;for(let yy=0;yy<15;yy+=6){ctx.beginPath();ctx.moveTo(-18,yy);ctx.lineTo(18,yy);ctx.stroke()}
   ctx.fillStyle="#d94c3d";ctx.beginPath();ctx.arc(-7,-8,6,0,Math.PI*2);ctx.fill();ctx.fillStyle="#f1d65b";ctx.beginPath();ctx.arc(6,-9,6,0,Math.PI*2);ctx.fill();ctx.fillStyle="#4b8b45";ctx.beginPath();ctx.ellipse(0,-15,7,3,-.4,0,Math.PI*2);ctx.fill();
   ctx.restore();
  }
  if(level===5){
   ctx.save();ctx.translate(19,-62);ctx.rotate(-.10);
   ctx.fillStyle="#f28a24";ctx.strokeStyle="#60351d";ctx.lineWidth=2;
   ctx.beginPath();ctx.ellipse(0,0,17,14,0,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.strokeStyle="#d66a1b";ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(-5,0,7,13,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(5,0,7,13,0,0,Math.PI*2);ctx.stroke();
   ctx.strokeStyle="#315b32";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(2,-20);ctx.stroke();
   ctx.restore();
  }
  // The skater carries a skateboard tucked diagonally along the outside of the body.
 if(level===4){
  ctx.save();ctx.translate(-31,-81);ctx.rotate(-.30);
  ctx.fillStyle="#d65c4e";ctx.strokeStyle="#171c20";ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(-5,-39,10,78,5);ctx.fill();ctx.stroke();
  ctx.fillStyle="#f1d6a2";ctx.fillRect(-3,-25,6,50);
  // Trucks and wheels are visible on both sides of the carried deck.
  for(let wy of [-25,25]){
   ctx.strokeStyle="#c5cbd0";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-7,wy);ctx.lineTo(7,wy);ctx.stroke();
   for(let wx of [-7,7]){
    ctx.fillStyle="#202326";ctx.beginPath();ctx.arc(wx,wy,4.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#aeb5b8";ctx.lineWidth=1;ctx.stroke();
   }
  }
  ctx.restore();
 }
 ctx.restore();ctx.restore();
}
function drawOffice(){
 ctx.fillStyle="#8b9197";ctx.fillRect(0,0,W,H);ctx.fillStyle="#d8dadd";ctx.fillRect(0,H*.58,W,H*.42);ctx.fillStyle="#aab0b5";ctx.fillRect(0,H*.55,W,18);
 for(let i=0;i<5;i++){let x=70+i*250;ctx.fillStyle="#496778";ctx.fillRect(x,145,190,220);ctx.strokeStyle="#dce4e7";ctx.lineWidth=8;ctx.strokeRect(x,145,190,220);ctx.beginPath();ctx.moveTo(x+95,145);ctx.lineTo(x+95,365);ctx.stroke()}
 for(let i=0;i<6;i++){let x=70+i*210;ctx.fillStyle="#f7f7f7";ctx.fillRect(x,70,130,18)}
 for(let i=0;i<4;i++){let x=80+i*290;ctx.fillStyle="#765f4c";ctx.fillRect(x,H*.49,170,25);ctx.fillStyle="#30383d";ctx.fillRect(x+15,H*.49-60,140,60)}

}
function drawPark(){
 ctx.fillStyle="#86c7e5";ctx.fillRect(0,0,W,H*.55);ctx.fillStyle="#69a94f";ctx.fillRect(0,H*.55,W,H*.45);
 ctx.fillStyle="#c9a56a";ctx.beginPath();ctx.moveTo(W*.36,H);ctx.quadraticCurveTo(W*.5,H*.62,W*.62,H*.55);ctx.quadraticCurveTo(W*.72,H*.75,W*.78,H);ctx.fill();
 for(let i=0;i<5;i++){let x=90+i*240,y=H*.43;ctx.fillStyle="#6b442c";ctx.fillRect(x,y,25,150);ctx.fillStyle="#3c7c3b";ctx.beginPath();ctx.arc(x+10,y-30,65,0,7);ctx.fill()}
 // Removed disconnected sign/stand rectangles from the park scene.

}
function drawSkateboard(x,y,angle,deck){
 ctx.save();ctx.translate(x,y);ctx.rotate(angle);
 ctx.fillStyle=deck;ctx.beginPath();ctx.roundRect(-43,-7,86,14,7);ctx.fill();
 ctx.strokeStyle="#d7dadd";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-25,1);ctx.lineTo(25,1);ctx.stroke();
 ctx.fillStyle="#24282b";
 for(let wx of [-27,27]){ctx.beginPath();ctx.arc(wx,10,7,0,Math.PI*2);ctx.fill();ctx.fillStyle="#aeb5b8";ctx.beginPath();ctx.arc(wx,10,3,0,Math.PI*2);ctx.fill();ctx.fillStyle="#24282b"}
 ctx.restore();
}
function drawSkatePark(){
 ctx.fillStyle="#89b8d2";ctx.fillRect(0,0,W,H*.52);ctx.fillStyle="#9a9b9d";ctx.fillRect(0,H*.52,W,H*.48);
 ctx.fillStyle="#77797b";ctx.beginPath();ctx.moveTo(W*.05,H);ctx.quadraticCurveTo(W*.13,H*.47,W*.22,H);ctx.fill();
 ctx.fillStyle="#c5c7c8";ctx.beginPath();ctx.moveTo(W*.32,H*.9);ctx.quadraticCurveTo(W*.4,H*.5,W*.48,H*.9);ctx.lineTo(W*.48,H);ctx.lineTo(W*.32,H);ctx.fill();
 ctx.strokeStyle="#55585b";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(W*.62,H*.78);ctx.lineTo(W*.82,H*.78);ctx.stroke();ctx.fillStyle="#55585b";ctx.fillRect(W*.69,H*.78,8,90);ctx.fillRect(W*.79,H*.78,8,90);
 drawSkateboard(W*.20,H*.84,-.10,"#d65c4e");drawSkateboard(W*.48,H*.90,.12,"#3e8fb1");drawSkateboard(W*.83,H*.86,-.18,"#e2bd4c");

}
function drawPumpkinPatch(){
 ctx.fillStyle="#8bc6e4";ctx.fillRect(0,0,W,H*.5);ctx.fillStyle="#8b9f4e";ctx.fillRect(0,H*.5,W,H*.5);
 ctx.fillStyle="#6c813b";for(let y=H*.6;y<H;y+=55)ctx.fillRect(0,y,W,8);
 for(let i=0;i<24;i++){let x=40+(i*83)%W,y=H*.56+((i*47)%(H*.4));ctx.fillStyle=i%3?"#e87828":"#f28c28";ctx.beginPath();ctx.ellipse(x,y,22,18,0,0,7);ctx.ellipse(x+20,y,22,18,0,0,7);ctx.fill();ctx.fillStyle="#4d7034";ctx.fillRect(x+8,y-25,8,12)}
 ctx.fillStyle="#6f4a2e";ctx.fillRect(W*.73,H*.27,25,210);ctx.fillStyle="#4e7b3d";ctx.beginPath();ctx.arc(W*.74,H*.25,90,0,7);ctx.fill();

}
function draw(){
 ctx.clearRect(0,0,W,H);drawSky();switch(currentScene){case 1:drawHospital();break;case 2:drawOffice();break;case 3:drawPark();break;case 4:drawSkatePark();break;case 5:drawPumpkinPatch();break;default:drawHospital();}
 if(screen==="game"){for(let z of zombies)zombie(z);drawEffects();return}
}
function drawEffects(){
 for(let s of splats){ctx.globalAlpha=Math.max(0,s.life/1.1);ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();for(let d of s.d){ctx.beginPath();ctx.arc(s.x+d.x,s.y+d.y,d.r,0,7);ctx.fill()};ctx.globalAlpha=1}
 for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/.7);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5,0,7);ctx.fill();ctx.globalAlpha=1}
}
function paintball(){
 let z=zombies[0];if(!z)return;
 let y=H*.53+z.lane*H*.12-120;
 splats.push({x:z.x,y:y-20,r:28,c:["#ff4b72","#4db8ff","#ffd447","#64d66f","#b66cff"][round%5],life:1.1,d:Array.from({length:10},()=>({x:(Math.random()-.5)*75,y:(Math.random()-.5)*75,r:3+Math.random()*8}))});
 for(let i=0;i<24;i++){let a=Math.random()*Math.PI*2,v=80+Math.random()*240;particles.push({x:z.x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+.35*Math.random(),c:["#ff4b72","#4db8ff","#ffd447","#64d66f","#b66cff"][round%5]})}
 score+=150+combo*25;combo++;correct++;shake=8;zombies=[];typed="";spawnTimer=0;if(round>=20){setTimeout(()=>{if(running)endGame("Level Complete")},260)}
}
function wrongKey(){wrong++;combo=0;shake=4}
function updateHUD(){
 let s=stats();document.getElementById("score").textContent=score;document.getElementById("accuracy").textContent=s.acc.toFixed(0);document.getElementById("wpm").textContent=s.wpm.toFixed(0);document.getElementById("paint").textContent=correct;
}
function loop(now){
 if(!running)return;let dt=Math.min(.04,(now-last)/1000);last=now;
 for(let c of clouds){c.x-=c.v*dt;if(c.x<-200)c.x=W+100}
 for(let z of zombies){z.x-=z.speed*dt;z.walkTime=(z.walkTime||0)+dt;if(z.x<W*.26){z.x=W*.26;shake=2;endGame("Too Close!");return}}
 for(let s of splats)s.life-=dt; splats=splats.filter(s=>s.life>0);
 for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
 if(!zombies.length){spawnTimer+=dt;if(spawnTimer>.5){spawnTimer=0;newZombie()}}
 updateHUD();if(shake>0)shake-=dt*18;
 ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);draw();ctx.restore();
 raf=requestAnimationFrame(loop);
}
function stats(){let sec=Math.max(.1,(performance.now()-startTime)/1000);return {acc:correct/Math.max(1,correct+wrong)*100,wpm:(correct/5)/(sec/60)}}
const LEADERBOARD_KEY="typingDefenderLeaderboard";
function getScores(){try{return JSON.parse(localStorage.getItem(LEADERBOARD_KEY)||"[]")}catch(e){return[]}}
function isTopScore(v){let a=getScores().filter(x=>x.level===level);return a.length<10||a.some(x=>v>x.score)}
function saveScore(name,st){let a=getScores();a.push({name:name||"Player",score,level,accuracy:Math.round(st.acc),wpm:Math.round(st.wpm)});a.sort((x,y)=>y.score-x.score);localStorage.setItem(LEADERBOARD_KEY,JSON.stringify(a.slice(0,50)))}
function showLeaderboard(levelOnly=null){
 let a=getScores(),levels=levelOnly===null?[1,2,3,4,5]:[levelOnly];
 let title=levelOnly===null?"ALL LEADERBOARDS":"LEVEL "+levelOnly+" LEADERBOARD";
 let h='<div class="overlay"><div class="panel"><h1>'+title+'</h1>';
 for(let lv of levels){
  let b=a.filter(x=>x.level===lv).sort((x,y)=>y.score-x.score).slice(0,10);
  h+='<div class="board"><h3>LEVEL '+lv+' — '+LEVELS[lv].name+'</h3><div class="board-row head"><span>#</span><span>NAME</span><span>SCORE</span></div>';
  if(!b.length)h+='<div class="board-row"><span>-</span><span>No scores yet</span><span>-</span></div>';
  b.forEach((x,i)=>h+='<div class="board-row"><span>'+(i+1)+'</span><span>'+esc(x.name)+'</span><span>'+x.score+'</span></div>');
  h+='</div>';
 }
 h+='<div class="levels"><button onclick="showMenu()">LEVELS</button>';
 if(levelOnly!==null)h+='<button onclick="showLeaderboard()">ALL LEADERBOARDS</button>';
 h+='<button onclick="clearLeaderboard()">CLEAR SCORES</button></div></div></div>';
 screen="leaderboard";ui(h);draw()
}
function clearLeaderboard(){if(confirm("Clear all leaderboard scores?")){localStorage.removeItem(LEADERBOARD_KEY);showLeaderboard()}}
let lastStats={acc:0,wpm:0};
function submitScore(){let n=document.getElementById("scoreName").value.trim();if(!n){alert("Please enter a name.");return}saveScore(n,lastStats);showLeaderboard(level)}
function endGame(title="Level Complete"){running=false;cancelAnimationFrame(raf);screen="over";document.getElementById("hud").hidden=true;document.getElementById("word").hidden=true;document.getElementById("typed").hidden=true;lastStats=stats();if(isTopScore(score)){ui('<div class="overlay"><div class="panel"><h1>NEW HIGH SCORE!</h1><h2>'+score+' points</h2><input id="scoreName" class="namebox" maxlength="18" placeholder="Enter name" autofocus><div class="levels"><button onclick="submitScore()">SAVE SCORE</button></div></div></div>');draw();return}ui('<div class="overlay"><div class="panel"><h1>Paintball Defender</h1><h2>'+title+'</h2><p>SCORE: <b>'+score+'</b></p><p>ACCURACY: <b>'+lastStats.acc.toFixed(0)+'%</b> &nbsp; WPM: <b>'+lastStats.wpm.toFixed(0)+'</b></p><div class="levels"><button onclick="startGame('+level+')">PLAY AGAIN</button><button onclick="showLeaderboard(level)">THIS LEVEL LEADERBOARD</button><button onclick="showMenu()">LEVELS</button></div></div></div>');draw()}

addEventListener("keydown",e=>{
 if(e.key==="Escape"){e.preventDefault();showMenu();return}
 if(e.target&&["INPUT","TEXTAREA"].includes(e.target.tagName))return;
 if(!running||screen!=="game")return;
 if(e.key==="Enter"){e.preventDefault();return}
 let k=e.key;
 if(k.length!==1)return;
 if(k===word[wordIndex]){typed+=k;wordIndex++;updateWord();if(wordIndex>=word.length)paintball()}
 else wrongKey();
 updateHUD();
});
resize();
let params=new URLSearchParams(location.search);
if(params.has("level")){let n=Number(params.get("level"));if(n>=1&&n<=5)startGame(n);else showMenu()}else showMenu();
</script>
